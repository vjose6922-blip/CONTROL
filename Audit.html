<h1>

<p>

<!-- =========================================================
     APLICACIÓN
     ========================================================= -->

<script>

    const errorLog =
        document.getElementById('error-log');

    const status =
        document.getElementById('status');

    const debugContent =
        document.getElementById('debug-content');


    function debug(message, ok = false) {

        const div =
            document.createElement('div');

        div.textContent =
            message;

        if (ok) {
            div.className =
                'debug-ok';
        }

        debugContent.appendChild(div);

        console.log(
            '[AUDITORIA]',
            message
        );
    }


    function showError(message, error) {

        errorLog.style.display =
            'block';

        errorLog.textContent =
            'Error crítico:\n\n' +
            message +
            '\n\n' +
            (error
                ? error.message
                : 'Sin detalles adicionales.');

        status.textContent =
            '❌ Univer no pudo iniciar';

        status.style.background =
            '#f8d7da';

        status.style.color =
            '#842029';

        status.style.borderColor =
            '#f1aeb5';

        console.error(
            message,
            error
        );
    }


    /*
     * =========================================================
     * DATOS DE AUDITORÍA
     * =========================================================
     */

    const auditSnapshot = {

        id: 'audit-workbook-1',

        name: 'Auditoría de Tareas',

        sheetOrder: [
            'sheet-1'
        ],

        sheets: {

            'sheet-1': {

                id: 'sheet-1',

                name: 'Registro de Actividades',

                rowCount: 100,

                columnCount: 10,

                cellData: {

                    0: {
                        0: { v: 'ID' },
                        1: { v: 'Fecha' },
                        2: { v: 'Usuario' },
                        3: { v: 'Rol' },
                        4: { v: 'Acción' },
                        5: { v: 'Detalle' },
                        6: { v: 'Estado' },
                        7: { v: 'IP Origen' }
                    },

                    1: {
                        0: { v: 1001 },
                        1: { v: '2026-09-24 09:15' },
                        2: { v: 'carlos.mendoza' },
                        3: { v: 'Admin' },
                        4: { v: 'Crear Usuario' },
                        5: { v: 'Alta de nuevo moderador: laura.gomez' },
                        6: { v: 'Completado' },
                        7: { v: '192.168.1.45' }
                    },

                    2: {
                        0: { v: 1002 },
                        1: { v: '2026-09-24 10:02' },
                        2: { v: 'laura.gomez' },
                        3: { v: 'Moderador' },
                        4: { v: 'Editar Contenido' },
                        5: { v: 'Eliminación de post ofensivo #4432' },
                        6: { v: 'Completado' },
                        7: { v: '10.0.0.12' }
                    },

                    3: {
                        0: { v: 1003 },
                        1: { v: '2026-09-24 11:45' },
                        2: { v: 'ana.torres' },
                        3: { v: 'Admin' },
                        4: { v: 'Cambio de Permisos' },
                        5: { v: 'Modificación de rol para usuario pedro.ruiz' },
                        6: { v: 'Pendiente Revisión' },
                        7: { v: '192.168.1.22' }
                    },

                    4: {
                        0: { v: 1004 },
                        1: { v: '2026-09-24 14:30' },
                        2: { v: 'javier.lopez' },
                        3: { v: 'Moderador' },
                        4: { v: 'Revisión de Reporte' },
                        5: { v: 'Revisión de reporte de usuario #7890' },
                        6: { v: 'Rechazado' },
                        7: { v: '10.0.0.55' }
                    },

                    5: {
                        0: { v: 1005 },
                        1: { v: '2026-09-25 08:00' },
                        2: { v: 'carlos.mendoza' },
                        3: { v: 'Admin' },
                        4: { v: 'Backup de Sistema' },
                        5: { v: 'Respaldo completo de base de datos' },
                        6: { v: 'Completado' },
                        7: { v: '192.168.1.45' }
                    },

                    6: {
                        0: { v: 1006 },
                        1: { v: '2026-09-25 09:20' },
                        2: { v: 'laura.gomez' },
                        3: { v: 'Moderador' },
                        4: { v: 'Aprobación de Contenido' },
                        5: { v: 'Aprobación de artículo pendiente #1024' },
                        6: { v: 'En Proceso' },
                        7: { v: '10.0.0.12' }
                    }

                }

            }

        }

    };


    /*
     * =========================================================
     * VALIDACIÓN DE DEPENDENCIAS
     * =========================================================
     */

    try {

        debug('Verificando dependencias...');


        if (!window.React) {
            throw new Error(
                'React no está cargado.'
            );
        }

        debug(
            '✓ React cargado',
            true
        );


        if (!window.ReactDOM) {
            throw new Error(
                'ReactDOM no está cargado.'
            );
        }

        debug(
            '✓ ReactDOM cargado',
            true
        );


        if (!window.Rx) {
            throw new Error(
                'RxJS no está cargado.'
            );
        }

        debug(
            '✓ RxJS cargado',
            true
        );


        if (!window.UniverCore) {
            throw new Error(
                'UniverCore no está cargado.'
            );
        }

        debug(
            '✓ UniverCore cargado',
            true
        );


        if (!window.UniverSheets) {
            throw new Error(
                'UniverSheets no está cargado.'
            );
        }

        debug(
            '✓ UniverSheets cargado',
            true
        );


        if (!window.UniverUi) {
            throw new Error(
                'UniverUi no está cargado.'
            );
        }

        debug(
            '✓ UniverUi cargado',
            true
        );


        if (!window.UniverCoreFacade) {
            throw new Error(
                'UniverCoreFacade no está cargado.'
            );
        }

        debug(
            '✓ UniverCoreFacade cargado',
            true
        );


        /*
         * =====================================================
         * CREAR UNIVERS
         * =====================================================
         */

        debug(
            'Creando instancia de Univer...'
        );


        const {

            Univer,

            LocaleType,

            mergeLocales,

            UniverInstanceType

        } = UniverCore;


        const {
            FUniver
        } = UniverCoreFacade;


        const {
            UniverRenderEnginePlugin
        } = UniverEngineRender;


        const {
            UniverFormulaEnginePlugin
        } = UniverEngineFormula;


        const {
            UniverUIPlugin
        } = UniverUi;


        const {
            UniverSheetsPlugin
        } = UniverSheets;


        const {
            UniverSheetsUIPlugin
        } = UniverSheetsUi;


        const {
            UniverDocsPlugin
        } = UniverDocs;


        const {
            UniverDocsUIPlugin
        } = UniverDocsUi;


        const {
            UniverSheetsFormulaPlugin
        } = UniverSheetsFormula;


        const {
            UniverSheetsFormulaUIPlugin
        } = UniverSheetsFormulaUi;


        const {
            UniverSheetsNumfmtPlugin
        } = UniverSheetsNumfmt;


        const {
            UniverSheetsNumfmtUIPlugin
        } = UniverSheetsNumfmtUi;


        /*
         * Crear Univer
         */

        const univer =
            new Univer({

                locale:
                    LocaleType.EN_US,

                locales: {

                    [LocaleType.EN_US]:

                        mergeLocales(

                            UniverDesignEnUS,

                            UniverUiEnUS,

                            UniverSheetsEnUS,

                            UniverSheetsUiEnUS,

                            UniverDocsUiEnUS,

                            UniverSheetsFormulaUiEnUS,

                            UniverSheetsNumfmtUiEnUS

                        )

                }

            });


        debug(
            '✓ Instancia de Univer creada',
            true
        );


        /*
         * Registrar plugins
         */

        univer.registerPlugin(
            UniverRenderEnginePlugin
        );


        univer.registerPlugin(
            UniverFormulaEnginePlugin
        );


        univer.registerPlugin(
            UniverUIPlugin,
            {
                container:
                    'univer-container'
            }
        );


        univer.registerPlugin(
            UniverDocsPlugin
        );


        univer.registerPlugin(
            UniverDocsUIPlugin
        );


        univer.registerPlugin(
            UniverSheetsPlugin
        );


        univer.registerPlugin(
            UniverSheetsUIPlugin
        );


        univer.registerPlugin(
            UniverSheetsFormulaPlugin
        );


        univer.registerPlugin(
            UniverSheetsFormulaUIPlugin
        );


        univer.registerPlugin(
            UniverSheetsNumfmtPlugin
        );


        univer.registerPlugin(
            UniverSheetsNumfmtUIPlugin
        );


        debug(
            '✓ Plugins de Sheets registrados',
            true
        );


        /*
         * Crear workbook
         */

        debug(
            'Creando workbook...'
        );


        univer.createUnit(
            UniverInstanceType.UNIVER_SHEET,
            auditSnapshot
        );


        const univerAPI =
            FUniver.newAPI(
                univer
            );


        if (!univerAPI) {

            throw new Error(
                'No fue posible crear univerAPI.'
            );

        }


        debug(
            '✓ univerAPI creado',
            true
        );


        status.textContent =
            '✅ Panel de auditoría cargado correctamente';


        status.style.background =
            '#d1e7dd';

        status.style.color =
            '#0f5132';

        status.style.borderColor =
            '#a3cfbb';


        debug(
            '========================================',
            true
        );

        debug(
            '✓ UNIVER INICIALIZADO CORRECTAMENTE',
            true
        );

        debug(
            '========================================',
            true
        );


    } catch (error) {

        showError(
            'No fue posible inicializar Univer.',
            error
        );

    }

</script>
