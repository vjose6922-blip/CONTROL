<h1>Panel de Auditoría de Tareas</h1>

<p>
    Usuario Master · Datos de ejemplo de tareas realizadas por Administradores y Moderadores
</p>

<div id="status">
    ⏳ Cargando Univer...

<div id="error-log"></div>

<div id="univer-container"></div>

<div class="debug" id="debug-log">
    Inicializando...
</div>


<!-- =========================================================
     UNIVER V2
     Usamos ES Modules en lugar de window.UniverPresets
     ========================================================= -->

<script type="module">

    const errorLog = document.getElementById('error-log');
    const status = document.getElementById('status');
    const debugLog = document.getElementById('debug-log');


    function debug(message, type = '') {
        const line = document.createElement('div');

        if (type) {
            line.className = type;
        }

        line.textContent = message;

        debugLog.appendChild(line);

        console.log('[UNIVER]', message);
    }


    function showError(message, error = null) {

        errorLog.style.display = 'block';

        errorLog.textContent =
            'Error crítico:\n\n' +
            message +
            (error ? '\n\nDetalles:\n' + error.message : '');

        status.textContent = '❌ Univer no pudo iniciar';
        status.style.background = '#f8d7da';
        status.style.color = '#842029';
        status.style.borderColor = '#f1aeb5';

        console.error(message, error);
    }


    window.addEventListener('error', function(event) {

        console.error(
            'Error global:',
            event.message,
            event.error
        );

    });


    /*
     * =========================================================
     * DATOS DE AUDITORÍA
     * =========================================================
     */

    /*
     * =========================================================
     * INICIO
     * =========================================================
     */

    async function iniciarUniver() {

        try {

            debug('Iniciando carga de módulos...');


            /*
             * Importamos directamente desde jsDelivr.
             *
             * IMPORTANTE:
             * No utilizamos:
             *
             * window.UniverPresets
             *
             * porque ese global no existe en la distribución
             * moderna.
             */

            debug('Cargando @univerjs/presets...');

            const presets = await import(
                'https://cdn.jsdelivr.net/npm/@univerjs/presets@0.9.0/lib/index.js'
            );

            debug('✓ @univerjs/presets cargado', 'ok');


            debug('Cargando preset de Sheets...');

            const sheets = await import(
                'https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-core@0.9.0/lib/index.js'
            );

            debug('✓ @univerjs/preset-sheets-core cargado', 'ok');


            /*
             * Cargamos CSS mediante <link>.
             */

            const css = document.createElement('link');

            css.rel = 'stylesheet';

            css.href =
                'https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-core@0.9.0/lib/index.css';

            document.head.appendChild(css);

            debug('✓ CSS de Sheets agregado', 'ok');


            /*
             * Verificación de exports.
             */

            if (!presets.createUniver) {

                throw new Error(
                    'El módulo @univerjs/presets se cargó, pero no contiene createUniver.'
                );

            }

            if (!presets.LocaleType) {

                throw new Error(
                    'El módulo @univerjs/presets no contiene LocaleType.'
                );

            }

            if (!sheets.UniverSheetsCorePreset) {

                throw new Error(
                    'El módulo de Sheets no contiene UniverSheetsCorePreset.'
                );

            }


            debug('✓ createUniver encontrado', 'ok');

            debug('✓ LocaleType encontrado', 'ok');

            debug('✓ UniverSheetsCorePreset encontrado', 'ok');


            const {
                createUniver,
                LocaleType
            } = presets;


            const {
                UniverSheetsCorePreset
            } = sheets;


            /*
             * =====================================================
             * CREAR UNIVERS
             * =====================================================
             */

            debug('Creando instancia de Univer...');


            const univerInstance = createUniver({

                locale: LocaleType.EN_US,

                locales: {},

                presets: [

                    UniverSheetsCorePreset({

                        container: 'univer-container'

                    })

                ]

            });


            if (!univerInstance) {

                throw new Error(
                    'createUniver() no devolvió una instancia válida.'
                );

            }


            const {
                univerAPI
            } = univerInstance;


            if (!univerAPI) {

                throw new Error(
                    'La instancia de Univer no contiene univerAPI.'
                );

            }


            debug('✓ Univer inicializado', 'ok');


            /*
             * =====================================================
             * CARGAR WORKBOOK
             * =====================================================
             */

            debug('Cargando workbook de auditoría...');


            univerAPI.createWorkbook(
                auditSnapshot
            );


            debug('✓ Workbook cargado correctamente', 'ok');


            status.textContent =
                '✅ Panel de auditoría cargado correctamente';

            status.style.background = '#d1e7dd';
            status.style.color = '#0f5132';
            status.style.borderColor = '#a3cfbb';


            console.log(
                '========================================'
            );

            console.log(
                '✅ UNIVER INICIALIZADO CORRECTAMENTE'
            );

            console.log(
                '========================================'
            );


        } catch (error) {

            showError(
                'No fue posible inicializar Univer.',
                error
            );

        }

    }


    /*
     * Ejecutar
     */

    iniciarUniver();

</script>
