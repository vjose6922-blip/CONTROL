// === MODULE: Data Features — Sort ===
const Sort = {
  sort(col,ascending){
    const sheet=getActiveSheet();
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    History.snapshot();
    // Build rows array (skip header row)
    const headerR=r0;
    const rows=[];
    for(let r=r0+1;r<=r1;r++)rows.push(r);
    rows.sort((a,b)=>{
      const ca=getCell(sheet,a,col),cb=getCell(sheet,b,col);
      let va=ca?ca.v:'',vb=cb?cb.v:'';
      if(typeof va==='number'&&typeof vb==='number')return ascending?va-vb:vb-va;
      return ascending?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va));
    });
    // Rebuild: collect cell data for sorted rows, then place back
    const sortedData=rows.map(r=>{
      const rowData={};
      for(let c=c0;c<=c1;c++){
        const k=cellKey(r,c);
        if(sheet.cells[k])rowData[k]=U.deepClone(sheet.cells[k]);
      }
      return rowData;
    });
    // Clear and rewrite
    for(let r=r0+1;r<=r1;r++){
      for(let c=c0;c<=c1;c++)delete sheet.cells[cellKey(r,c)];
    }
    rows.forEach((srcR,i)=>{
      const destR=r0+1+i;
      const data=sortedData[i];
      for(const k in data){
        const[kr,kc]=k.split(',');
        sheet.cells[cellKey(destR,parseInt(kc))]=data[k];
      }
    });
    Formula.recalc(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },

  multiSort(cols){
    // cols: [{col,asc}, ...]
    const sheet=getActiveSheet();
    const{r0,r1}=Sel.getSelectedRange();
    History.snapshot();
    const rows=[];
    for(let r=r0+1;r<=r1;r++)rows.push(r);
    rows.sort((a,b)=>{
      for(const{col,asc} of cols){
        const ca=getCell(sheet,a,col),cb=getCell(sheet,b,col);
        let va=ca?ca.v:'',vb=cb?cb.v:'';
        let cmp;
        if(typeof va==='number'&&typeof vb==='number')cmp=va-vb;
        else cmp=String(va).localeCompare(String(vb));
        if(!asc)cmp=-cmp;
        if(cmp!==0)return cmp;
      }
      return 0;
    });
    const sortedData=rows.map(r=>{
      const rowData={};
      for(let c=0;c<MAX_COLS;c++){const k=cellKey(r,c);if(sheet.cells[k])rowData[k]=U.deepClone(sheet.cells[k]);}
      return rowData;
    });
    for(let r=r0+1;r<=r1;r++){for(let c=0;c<MAX_COLS;c++)delete sheet.cells[cellKey(r,c)];}
    rows.forEach((srcR,i)=>{const destR=r0+1+i;const data=sortedData[i];for(const k in data){const[kr,kc]=k.split(',');sheet.cells[cellKey(destR,parseInt(kc))]=data[k];}});
    Formula.recalc(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },
};

// === MODULE: Data Features — Filter ===
const Filter = {
  apply(col,criteria,range){
    const sheet=getActiveSheet();
    History.snapshot();
    if(!sheet.autoFilter){sheet.autoFilter={range:range||Sel.getSelectedRange(),filters:{}};}
    sheet.autoFilter.filters[col]=criteria;
    this.applyFilters(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
  },

  applyFilters(sheet){
    if(!sheet.autoFilter)return;
    const{r0,r1,c0,c1}=sheet.autoFilter.range;
    const filters=sheet.autoFilter.filters;
    for(let r=r0+1;r<=r1;r++){
      let visible=true;
      for(const col in filters){
        const crit=filters[col];
        const cell=getCell(sheet,r,parseInt(col));
        const val=cell?String(cell.v??''):'';
        if(crit.type==='equals'&&val!==crit.value)visible=false;
        if(crit.type==='contains'&&!val.toLowerCase().includes(String(crit.value).toLowerCase()))visible=false;
        if(crit.type==='greater'&&parseFloat(val)<=parseFloat(crit.value))visible=false;
        if(crit.type==='less'&&parseFloat(val)>=parseFloat(crit.value))visible=false;
      }
      sheet.rowHidden[r]=!visible;
    }
  },

  remove(col){
    const sh=getActiveSheet(),af=sh.autoFilter;if(!af)return;delete af.filters[col];
    if(!Object.keys(af.filters).length)return this.clear();
    sh.rowHidden={};this.applyFilters(sh);Grid.needsRender=true;
  },

  clear(){
    const sheet=getActiveSheet();
    sheet.autoFilter=null;
    sheet.rowHidden={};
    Grid.needsRender=true;
    Storage.saveDebounced();
  },
};

// === MODULE: Data Features — Find & Replace ===
const Find = {
  find(query,replaceValue,replaceAll){
    const sheet=getActiveSheet();
    let found=false;
    const cur=State.selection.activeCell;
    const keys=Object.keys(sheet.cells).sort((a,b)=>{const[ar,ac]=a.split(',').map(Number),[br,bc]=b.split(',').map(Number);return ar-br||ac-bc;});
    const at=keys.findIndex(k=>{const[r,c]=k.split(',').map(Number);return r>cur.r||(r===cur.r&&c>cur.c);});
    const ordered=(replaceAll||replaceValue!==undefined||at<0)?keys:keys.slice(at).concat(keys.slice(0,at));
    for(const k of ordered){
      const cell=sheet.cells[k];
      const val=String(cell.v??'');
      if(val.toLowerCase().includes(query.toLowerCase())){
        const[kr,kc]=k.split(',');
        const r=parseInt(kr),c=parseInt(kc);
        if(replaceValue!==undefined){
          History.snapshot();
          Editor.setCellValueDirect(cell,cell.f?replaceValue:val.replace(new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),()=>replaceValue));
        }
        if(!replaceAll){
          Sel.selectCell(r,c);
          Sel.scrollIntoView(r,c);
          found=true;
          break;
        }
        found=true;
      }
    }
    if(found&&replaceValue!==undefined){
      Formula.recalc(sheet);
      Storage.saveDebounced();
      UI.setSaveIndicator(false);
    }
    Grid.needsRender=true;
    return found;
  },
};

// === MODULE: Data Validation ===
const Validation = {
  apply(range,type,params){
    const sheet=getActiveSheet();
    History.snapshot();
    if(!sheet.validations)sheet.validations={};
    sheet.validations[`${range.r0},${range.c0},${range.r1},${range.c1}`]={type,params};
    Storage.saveDebounced();
  },

  validate(sheet,r,c,value){
    for(const k in sheet.validations){
      const v=sheet.validations[k];
      const[rr0,cc0,rr1,cc1]=k.split(',').map(Number);
      if(r>=rr0&&r<=rr1&&c>=cc0&&c<=cc1){
        if(v.type==='list'){
          if(!v.params.values.includes(value))return{valid:false,message:'El valor no está en la lista'};
        }
        if(v.type==='number'){
          const n=parseFloat(value);
          if(isNaN(n))return{valid:false,message:'Debe ser un número'};
          if(v.params.min!==undefined&&n<v.params.min)return{valid:false,message:`Debe ser >= ${v.params.min}`};
          if(v.params.max!==undefined&&n>v.params.max)return{valid:false,message:`Debe ser <= ${v.params.max}`};
        }
        if(v.type==='date'){
          const d=new Date(value);
          if(isNaN(d))return{valid:false,message:'Debe ser una fecha válida'};
        }
      }
    }
    return{valid:true}; // <--- Ahora sí está en su lugar
  },

  // <--- Ahora es una función hermana, no está dentro de validate
  getValidation(sheet, r, c) {
    for (const k in sheet.validations) {
      const v = sheet.validations[k];
      const [r0, c0, r1, c1] = k.split(',').map(Number);
      if (r >= r0 && r <= r1 && c >= c0 && c <= c1) return v;
    }
    return null;
  }
};

// === MODULE: Charts (Canvas-based) ===
const Charts = {
  create(type){
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    const sheet=getActiveSheet();
    // Gather data
    const labels=[],data=[];
    for(let r=r0;r<=r1;r++){
      const cell=getCell(sheet,r,c0);
      labels.push(cell?String(cell.v??''):'');
      const row=[];
      for(let c=c0+1;c<=c1;c++){
        const vc=getCell(sheet,r,c);
        row.push(vc&&typeof vc.v==='number'?vc.v:0);
      }
      data.push(row);
    }
    const chart={id:U.uid(),type,range:{r0,r1,c0,c1},labels,data,x:200,y:200,w:400,h:300,sheetIdx:State.activeSheet};
    sheet.charts=sheet.charts||[];
    sheet.charts.push(chart);
    this.renderChart(chart);
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },

   renderChart(chart){
    const sheet=getActiveSheet();
    // Remove existing container
    const wrap=document.getElementById('gridwrap');
    let container=wrap.querySelector(`[data-chart="${chart.id}"]`);
    if(container)container.remove();
    container=document.createElement('div');
    container.className='chartcontainer';
    container.dataset.chart=chart.id;
    container.style.left=chart.x+'px';
    container.style.top=chart.y+'px';
    container.style.width=chart.w+'px';
    container.style.height=chart.h+'px';
    container.innerHTML=`<div class="charttitlebar">Gráfica ${({bar:'de barras',column:'de columnas',line:'de líneas',pie:'de pastel'})[chart.type]||''}<span class="chartclose">×</span></div><canvas style="width:100%;height:calc(100% - 20px)"></canvas>`;
    wrap.appendChild(container);
    const canvas=container.querySelector('canvas');
    canvas.width=chart.w;canvas.height=chart.h-20;
    this.drawChart(canvas,chart);
    
    // Arrastrar y Redimensionar usando el evento global
    const titlebar=container.querySelector('.charttitlebar');
    
    titlebar.addEventListener('mousedown',(e)=>{
      Charts.activeDrag = { chart: chart, container: container, sx: e.clientX, sy: e.clientY, ox: chart.x, oy: chart.y };
      e.preventDefault(); e.stopPropagation();
    });

    container.addEventListener('mousedown',(e)=>{
      if(e.target===container||e.target===canvas){
        const rect=container.getBoundingClientRect();
        if(e.clientX>rect.right-10&&e.clientY>rect.bottom-10){
          Charts.activeResize = { chart: chart, container: container, canvas: canvas, sx: e.clientX, sy: e.clientY, ow: chart.w, oh: chart.h };
          e.preventDefault(); e.stopPropagation();
        }
      }
    });

    // Close
    container.querySelector('.chartclose').addEventListener('click',()=>{
      container.remove();
      sheet.charts=sheet.charts.filter(c=>c.id!==chart.id);
      Storage.saveDebounced();
    });
  },

  // NUEVO: Manejador global de eventos para gráficas (Evita Memory Leak)
  bindGlobalEvents() {
    if(this._globalsBound) return;
    this._globalsBound = true;

    document.addEventListener('mousemove', (e) => {
      if (Charts.activeDrag) {
        const d = Charts.activeDrag;
        d.chart.x = d.ox + e.clientX - d.sx;
        d.chart.y = d.oy + e.clientY - d.sy;
        d.container.style.left = d.chart.x + 'px';
        d.container.style.top = d.chart.y + 'px';
      }
      if (Charts.activeResize) {
        const r = Charts.activeResize;
        r.chart.w = Math.max(200, r.ow + e.clientX - r.sx);
        r.chart.h = Math.max(150, r.oh + e.clientY - r.sy);
        r.container.style.width = r.chart.w + 'px';
        r.container.style.height = r.chart.h + 'px';
        r.canvas.width = r.chart.w; 
        r.canvas.height = r.chart.h - 20;
        Charts.drawChart(r.canvas, r.chart);
      }
    });

    document.addEventListener('mouseup', () => {
      if (Charts.activeDrag || Charts.activeResize) {
        Charts.activeDrag = null;
        Charts.activeResize = null;
        Storage.saveDebounced();
      }
    });
  },

  drawChart(canvas,chart){
    const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
    ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
    const colors=['#1a73e8','#e8453c','#f5a623','#34a853','#a855f7','#06b6d4'];
    const ns=Math.max(1,...chart.data.map(r=>r.length)),n=chart.data.length;
    const legend=chart.type!=='pie'&&ns>1;
    const padL=34,padR=12,padT=legend?30:14,padB=26;
    const cw=w-padL-padR,ch=h-padT-padB;
    ctx.font='10px sans-serif';ctx.textBaseline='alphabetic';
    if(legend){
      let lx=padL;
      for(let k=0;k<ns;k++){
        ctx.fillStyle=colors[k%colors.length];ctx.fillRect(lx,8,10,10);
        ctx.fillStyle='#333';ctx.textAlign='left';ctx.fillText('Serie '+(k+1),lx+14,17);lx+=62;
      }
    }
    if(chart.type==='pie'){
      const total=chart.data.reduce((a,r)=>a+Math.abs(r[0]||0),0)||1;
      let ang=-Math.PI/2;const cx=w/2,cy=h/2,rad=Math.max(10,Math.min(cw,ch)/2-14);
      chart.data.forEach((row,i)=>{
        const sl=(Math.abs(row[0]||0)/total)*Math.PI*2;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,rad,ang,ang+sl);ctx.closePath();
        ctx.fillStyle=colors[i%colors.length];ctx.fill();
        const mid=ang+sl/2;ctx.fillStyle='#333';ctx.textAlign='center';
        ctx.fillText(chart.labels[i]||'',cx+Math.cos(mid)*(rad+14),cy+Math.sin(mid)*(rad+14));
        ang+=sl;
      });
      return;
    }
    const all=chart.data.flat();
    const max=Math.max(0,...all)||1,min=Math.min(0,...all);
    const y=v=>padT+ch-((v-min)/(max-min||1))*ch;
    // Líneas guía y valores del eje
    ctx.strokeStyle='#eee';ctx.fillStyle='#666';ctx.textAlign='right';
    for(let t=0;t<=4;t++){
      const v=min+(max-min)*t/4,yy=y(v);
      ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(padL+cw,yy);ctx.stroke();
      ctx.fillText(Math.abs(v)>=1000?Math.round(v/100)/10+'k':(Math.round(v*10)/10)+'',padL-4,yy+3);
    }
    const step=cw/n;
    if(chart.type==='line'){
      const px=i=>padL+step*i+step/2;
      for(let k=0;k<ns;k++){
        ctx.strokeStyle=ctx.fillStyle=colors[k%colors.length];ctx.lineWidth=2;ctx.beginPath();
        chart.data.forEach((row,i)=>{const v=row[k]||0;i?ctx.lineTo(px(i),y(v)):ctx.moveTo(px(i),y(v));});
        ctx.stroke();
        chart.data.forEach((row,i)=>{ctx.beginPath();ctx.arc(px(i),y(row[k]||0),3,0,Math.PI*2);ctx.fill();});
      }
    }else{
      const gw=step*0.75,bw=gw/ns;
      chart.data.forEach((row,i)=>{
        const x0=padL+i*step+(step-gw)/2;
        for(let k=0;k<ns;k++){
          const v=row[k]||0,yy=y(v),y0=y(0);
          ctx.fillStyle=ns>1?colors[k%colors.length]:colors[i%colors.length];
          ctx.fillRect(x0+k*bw,Math.min(yy,y0),Math.max(1,bw-1),Math.abs(y0-yy));
        }
      });
    }
    ctx.fillStyle='#333';ctx.textAlign='center';
    chart.labels.forEach((l,i)=>ctx.fillText(String(l).slice(0,12),padL+step*i+step/2,h-8));
    ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+ch);ctx.moveTo(padL,y(0));ctx.lineTo(padL+cw,y(0));ctx.stroke();
  },

  // Relee los datos de las celdas y redibuja si cambiaron
  updateLive(){
    const sheet=getActiveSheet();
    if(!sheet.charts||!sheet.charts.length)return;
    for(const ch of sheet.charts){
      const{r0,r1,c0,c1}=ch.range,labels=[],data=[];

        data.push(row);
      }
      if(JSON.stringify([labels,data])===JSON.stringify([ch.labels,ch.data]))continue;
      ch.labels=labels;ch.data=data;

  },

// === MODULE: Pivot Tables ===
const Pivot = {
  create(sourceRange,config){
    // config: {rows:[colIdx],cols:[colIdx],values:[{colIdx,agg}],filters:[]}
    const sheet=getActiveSheet();
    // Gather data
    const headers=[];
    for(let c=sourceRange.c0;c<=sourceRange.c1;c++){
      const cell=getCell(sheet,sourceRange.r0,c);
      headers.push(cell?String(cell.v??''):'Col'+c);
    }
    const dataRows=[];
    for(let r=sourceRange.r0+1;r<=sourceRange.r1;r++){
      const row=[];
      for(let c=sourceRange.c0;c<=sourceRange.c1;c++){
        const cell=getCell(sheet,r,c);
        row.push(cell?cell.v:'');
      }
      dataRows.push(row);
    }
    // Build pivot
    const result=this.buildPivot(dataRows,headers,config);
    // Create new sheet for pivot
    const newSheet=createSheet('Dinámica'+(State.workbook.sheets.length));
    // Write pivot data to new sheet
    let r=0;
    // Row field headers
    config.rows.forEach((colIdx,i)=>{
      setCellValue(newSheet,r,i,headers[sourceRange.c0+colIdx-sourceRange.c0]||'Row');
    });
    // Column values as headers
    result.colValues.forEach((cv,i)=>{
      setCellValue(newSheet,r,config.rows.length+i,cv);
    });
    if(config.values.length>1){
      setCellValue(newSheet,r,config.rows.length+result.colValues.length,'Total');
    }
    r++;
    // Data rows
    result.rowValues.forEach(rv=>{
      config.rows.forEach((colIdx,i)=>{setCellValue(newSheet,r,i,rv);});
      result.colValues.forEach((cv,ci)=>{
        const agg=result.data[rv]&&result.data[rv][cv];
        setCellValue(newSheet,r,config.rows.length+ci,agg!==undefined?agg:0);
      });
      // Grand total
      if(config.values.length>1){
        let total=0;
        result.colValues.forEach(cv=>{total+=result.data[rv]&&result.data[rv][cv]||0;});
        setCellValue(newSheet,r,config.rows.length+result.colValues.length,total);
      }
      r++;
    });
    // Grand total row
    setCellValue(newSheet,r,0,'Total general');
    result.colValues.forEach((cv,ci)=>{
      let total=0;
      result.rowValues.forEach(rv=>{total+=result.data[rv]&&result.data[rv][cv]||0;});
      setCellValue(newSheet,r,config.rows.length+ci,total);
    });
    // Store pivot config for refresh
    newSheet.pivotTables=newSheet.pivotTables||[];
    newSheet.pivotTables.push({sourceSheet:State.activeSheet,sourceRange,config,startRow:0});
    State.workbook.sheets.push(newSheet);
    State.activeSheet=State.workbook.sheets.length-1;
    Grid.needsRender=true;
    UI.renderSheetTabs();
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },

  buildPivot(dataRows,headers,config){
    const rowKeys=new Set(),colKeys=new Set();
    const data={};
    for(const row of dataRows){
      const rowKey=config.rows.map(c=>row[c]).join('|');
      const colKey=config.cols.length?config.cols.map(c=>row[c]).join('|'):'Values';
      rowKeys.add(rowKey);
      colKeys.add(colKey);
      if(!data[rowKey])data[rowKey]={};
      if(!data[rowKey][colKey])data[rowKey][colKey]={sum:0,count:0,avg:0};
      config.values.forEach(v=>{
        const val=row[v.colIdx];
        const n=typeof val==='number'?val:parseFloat(val)||0;
        data[rowKey][colKey].sum+=n;
        data[rowKey][colKey].count++;
        data[rowKey][colKey].avg=data[rowKey][colKey].sum/data[rowKey][colKey].count;
      });
    }
    // Flatten to single value based on agg type
    const flatData={};
    for(const rk in data){
      flatData[rk]={};
      for(const ck in data[rk]){
        const agg=config.values[0].agg||'SUM';
        if(agg==='SUM')flatData[rk][ck]=data[rk][ck].sum;
        else if(agg==='COUNT')flatData[rk][ck]=data[rk][ck].count;
        else if(agg==='AVERAGE')flatData[rk][ck]=data[rk][ck].avg;
      }
    }
    return{rowValues:[...rowKeys],colValues:[...colKeys],data:flatData};
  },

  refresh(pivotIdx){
    const sheet=getActiveSheet();
    const pt=sheet.pivotTables[pivotIdx];
    if(!pt)return;
    const sourceSheet=State.workbook.sheets[pt.sourceSheet];
    const headers=[];
    for(let c=pt.sourceRange.c0;c<=pt.sourceRange.c1;c++){
      const cell=getCell(sourceSheet,pt.sourceRange.r0,c);
      headers.push(cell?String(cell.v??''):'Col'+c);
    }
    const dataRows=[];
    for(let r=pt.sourceRange.r0+1;r<=pt.sourceRange.r1;r++){
      const row=[];
      for(let c=pt.sourceRange.c0;c<=pt.sourceRange.c1;c++){
        const cell=getCell(sourceSheet,r,c);
        row.push(cell?cell.v:'');
      }
      dataRows.push(row);
    }
    const result=this.buildPivot(dataRows,headers,pt.config);
    // Rewrite (simplified — just re-create data)
    // Clear existing pivot data area
    for(const k in sheet.cells){
      const[kr,kc]=k.split(',');
      if(parseInt(kr)>=pt.startRow)delete sheet.cells[k];
    }
    // Re-write (same as create but to same sheet)
    let r=pt.startRow;
    pt.config.rows.forEach((colIdx,i)=>setCellValue(sheet,r,i,headers[colIdx]||'Row'));
    result.colValues.forEach((cv,i)=>setCellValue(sheet,r,pt.config.rows.length+i,cv));
    r++;
    result.rowValues.forEach(rv=>{
      pt.config.rows.forEach((colIdx,i)=>setCellValue(sheet,r,i,rv));
      result.colValues.forEach((cv,ci)=>{
        setCellValue(sheet,r,pt.config.rows.length+ci,result.data[rv]&&result.data[rv][cv]||0);
      });
      r++;
    });
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },
};

// === MODULE: Macros ===
const Macros = {
  saved:[],
  recording:null,

  getAPI(){
    return{
      getCell:(sheetName,r,c)=>{
        const sh=State.workbook.sheets.find(s=>s.name===sheetName)||getActiveSheet();
        const cell=getCell(sh,r-1,c-1);
        return cell?cell.v:'';
      },
      setCell:(sheetName,r,c,value)=>{
        const sh=State.workbook.sheets.find(s=>s.name===sheetName)||getActiveSheet();
        setCellValue(sh,r-1,c-1,value);
        Formula.recalc(sh);
        Grid.needsRender=true;
        Storage.saveDebounced();
      },
      getRange:(sheetName,r1,c1,r2,c2)=>{
        const sh=State.workbook.sheets.find(s=>s.name===sheetName)||getActiveSheet();
        const arr=[];
        for(let r=r1-1;r<=r2-1;r++){const row=[];for(let c=c1-1;c<=c2-1;c++){const cell=getCell(sh,r,c);row.push(cell?cell.v:'');}arr.push(row);}
        return arr;
      },
      setRange:(sheetName,r1,c1,values)=>{
        const sh=State.workbook.sheets.find(s=>s.name===sheetName)||getActiveSheet();
        for(let r=0;r<values.length;r++){for(let c=0;c<values[r].length;c++){setCellValue(sh,r1-1+r,c1-1+c,values[r][c]);}}
        Formula.recalc(sh);
        Grid.needsRender=true;
        Storage.saveDebounced();
      },
      alert:(msg)=>alert(msg),
      getSelection:()=>{
        const{r0,r1,c0,c1}=Sel.getSelectedRange();
        return{r1:r0+1,c1:c0+1,r2:r1+1,c2:c1+1,sheet:getActiveSheet().name};
      },
      recalc:()=>{Formula.recalcAll();Grid.needsRender=true;},
    };
  },

  run(code){
    try{
      const api=this.getAPI();
      const fn=new Function('Macro',code);
      fn(api);
    }catch(e){
      alert('Error en la macro: '+e.message);
    }
  },

  startRecording(){
    this.recording=[];
    UI.toast('Grabando macro...');
  },

  recordAction(action){
    if(this.recording)this.recording.push(action);
  },

  stopRecording(){
    if(!this.recording)return;
    const name=prompt('Nombre de la macro:','Macro'+(this.saved.length+1));
    if(!name){this.recording=null;return;}
    // Generate code from actions
    let code='// '+name+'\n';
    for(const a of this.recording){
      if(a.type==='setCell'){code+=`Macro.setCell('${a.sheet}',${a.r},${a.c},${JSON.stringify(a.value)});\n`;}
      else if(a.type==='select'){code+=`// Select ${a.addr}\n`;}
    }
    this.saved.push({id:U.uid(),name,code});
    this.recording=null;
    this.saveToStorage();
    UI.toast('Macro "'+name+'" guardada');
  },

  saveToStorage(){
    localStorage.setItem('excel_clone_macros'+EMBED.suffix,JSON.stringify(this.saved));
  },

  loadFromStorage(){
    try{this.saved=JSON.parse(localStorage.getItem('excel_clone_macros'+EMBED.suffix)||'[]');}catch(e){this.saved=[];}
  },

  delete(id){
    this.saved=this.saved.filter(m=>m.id!==id);
    this.saveToStorage();
  },

  insertButton(sheetIdx,r,c,macroId){
    const sheet=getActiveSheet();
    sheet.macroButtons=sheet.macroButtons||[];
    const btn={id:U.uid(),r,c,macroId,label:'Ejecutar macro'};
    sheet.macroButtons.push(btn);
    this.renderButton(btn);
    Storage.saveDebounced();
  },

  renderButton(btn){
    const wrap=document.getElementById('gridwrap');
    const el=document.createElement('div');
    el.className='macrobtn';
    el.style.left=(Grid.colX(btn.c)+2)+'px';
    el.style.top=(Grid.rowY(btn.r)+2)+'px';
    el.textContent=btn.label;
    el.addEventListener('click',()=>{
      const macro=Macros.saved.find(m=>m.id===btn.macroId);
      if(macro)Macros.run(macro.code);
    });
    el.dataset.btnId=btn.id;
    wrap.appendChild(el);
  },

  renderAllButtons(){
    const sheet=getActiveSheet();
    const wrap=document.getElementById('gridwrap');
    wrap.querySelectorAll('.macrobtn').forEach(e=>e.remove());
    if(sheet.macroButtons){for(const b of sheet.macroButtons)this.renderButton(b);}
  },
};

const IO = {
  exportCSV(){
    const sheet=getActiveSheet();
    let csv='';
    // Find max row/col with data
    let maxR=0,maxC=0;
    for(const k in sheet.cells){
      const[r,c]=k.split(',').map(Number);
      maxR=Math.max(maxR,r);maxC=Math.max(maxC,c);
    }
    for(let r=0;r<=maxR;r++){
      const row=[];
      for(let c=0;c<=maxC;c++){
        const cell=getCell(sheet,r,c);
        let val=cell?String(cell.v??''):'';
        if(val.includes(',')||val.includes('"')||val.includes('\n')){
          val='"'+val.replace(/"/g,'""')+'"';
        }
        row.push(val);
      }
      csv+=row.join(',')+'\n';
    }
    this.download(sheet.name+'.csv','\ufeff'+csv,'text/csv;charset=utf-8');
  },

  importCSV(file){
    const reader=new FileReader();
    reader.onload=(e)=>{
      const text=e.target.result;
      const rows=this.parseCSV(text);
      History.snapshot();
      const sheet=getActiveSheet();
      for(let r=0;r<rows.length;r++){
        for(let c=0;c<rows[r].length;c++){
          let val=rows[r][c];
          const n=parseFloat(val);
          if(!isNaN(n)&&val.trim()!==''&&!isNaN(Number(val)))val=n;
          setCellValue(sheet,r,c,val);
        }
      }
      Formula.recalc(sheet);
      Grid.needsRender=true;
      Storage.saveDebounced();
      UI.setSaveIndicator(false);
      UI.toast('CSV importado');
    };
    reader.readAsText(file);
  },

  parseCSV(text){
    text=text.replace(/^\ufeff/,'');
    const l1=text.split('\n')[0],delim=l1.split(';').length>l1.split(',').length?';':',';
    const rows=[];
    let row=[],val='',inQuote=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(inQuote){
        if(ch==='"'){
          if(text[i+1]==='"'){val+='"';i++;}
          else inQuote=false;
        }else val+=ch;
      }else{
        if(ch==='"')inQuote=true;
        else if(ch===delim){row.push(val);val='';}
        else if(ch==='\n'){row.push(val);rows.push(row);row=[];val='';}
        else if(ch==='\r'){}
        else val+=ch;
      }
    }
    if(val||row.length){row.push(val);rows.push(row);}
    return rows;
  },

  exportHTML(){
    const sheet=getActiveSheet();
    let maxR=0,maxC=0;
    for(const k in sheet.cells){const[r,c]=k.split(',').map(Number);maxR=Math.max(maxR,r);maxC=Math.max(maxC,c);}
    let html='<table border="1" style="border-collapse:collapse;font-family:sans-serif;font-size:13px">\n';
    for(let r=0;r<=maxR;r++){
      html+='<tr>';

        const cell=getCell(sheet,r,c);
        const fmt=cell&&cell.fmt||{};
        let style='';
        if(fmt.bold)style+='font-weight:bold;';
        if(fmt.italic)style+='font-style:italic;';
        if(fmt.bg)style+='background:'+fmt.bg+';';
        if(fmt.color)style+='color:'+fmt.color+';';
        if(fmt.align)style+='text-align:'+fmt.align+';';
        html+='<td style="'+style+'">'+(cell?this.escapeHTML(String(cell.v??'')):'')+'</td>';
      }
      html+='</tr>\n';
    }
    html+='</table>';
    this.download(sheet.name+'.html',html,'text/html');
  },

  escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');},

  download(filename,content,mime){

  exportXLSX(){

<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">

</workbook>`);
    // Workbook rels
    zip.add('xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
</Relationships>`);
    // Sheet data
    let maxR=0,maxC=0;
    for(const k in sheet.cells){const[r,c]=k.split(',').map(Number);maxR=Math.max(maxR,r);maxC=Math.max(maxC,c);}
    let rowsXml='';
    for(let r=0;r<=maxR;r++){

          cellsXml+=`<c r="${ref}" t="inlineStr"><is><t>${esc}</t></is></c>`;

    const data=zip.generate();

  // === Excel .xlsx Import (minimal ZIP/XML parser) ===
  importXLSX(file){
    const reader=new FileReader();
    reader.onload=async(e)=>{
      try{
        const data=new Uint8Array(e.target.result);
        const zip=new SimpleUnzip(data);
        const sheetXml=await zip.readAsync('xl/worksheets/sheet1.xml');
        if(!sheetXml){UI.toast('No se encontraron datos de hoja');return;}
        const sharedStringsXml=await zip.readAsync('xl/sharedStrings.xml');
        let sharedStrings=[];
        if(sharedStringsXml){
          const ssMatch=sharedStringsXml.match(/<si>([\s\S]*?)<\/si>/g)||[];
          sharedStrings=ssMatch.map(x=>[...x.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(m=>this.unescapeXML(m[1])).join(''));
        }
        History.snapshot();
        const sheet=getActiveSheet();
        // Clear existing
        sheet.cells={};
        const rowMatches=sheetXml.match(/<row[^>]*>([\s\S]*?)<\/row>/g)||[];
        for(const rowXml of rowMatches){
          const rMatch=rowXml.match(/<row[^>]*r="(\d+)"/);
          if(!rMatch)continue;
          const r=parseInt(rMatch[1])-1;
          const cellMatches=rowXml.match(/<c[^>]*>[\s\S]*?<\/c>|<c[^>]*\/>/g)||[];
          for(const cellXml of cellMatches){
            const refMatch=cellXml.match(/r="([A-Z]+\d+)"/);
            if(!refMatch)continue;
            const addr=U.parseAddr(refMatch[1]);
            if(!addr)continue;
            const typeMatch=cellXml.match(/t="(\w+)"/);
            const type=typeMatch?typeMatch[1]:'n';
            const vMatch=cellXml.match(/<v>([\s\S]*?)<\/v>/);
            const isMatch=cellXml.match(/<is><t[^>]*>([\s\S]*?)<\/t><\/is>/);
            let val='';
            if(type==='s'&&vMatch){
              val=sharedStrings[parseInt(vMatch[1])]||'';
            }else if(type==='inlineStr'&&isMatch){
              val=this.unescapeXML(isMatch[1]);
            }else if(vMatch&&(type==='str'||type==='e')){val=this.unescapeXML(vMatch[1]);
            }else if(vMatch&&type==='b'){val=vMatch[1]==='1';
            }else if(vMatch){val=parseFloat(vMatch[1]);
            }
            setCellValue(sheet,addr.row,addr.col,val);
          }
        }
        Formula.recalc(sheet);
        Grid.needsRender=true;
        Storage.saveDebounced();
        UI.setSaveIndicator(false);
        UI.toast('XLSX importado');
      }catch(err){
        alert('Error al importar XLSX: '+err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  },

  unescapeXML(s){return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');},
};

// === MODULE: Simple ZIP Writer (minimal, no compression) ===
class SimpleZip{
  constructor(){this.files=[];}
  add(name,content){
    const encoder=new TextEncoder();
    const data=typeof content==='string'?encoder.encode(content):content;
    this.files.push({name,data});
  }
  generate(){
    const enc=new TextEncoder(),parts=[],central=[];let offset=0;
    const T=SimpleZip.crcT||(SimpleZip.crcT=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0;}));
    const crc32=(d)=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=T[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};
    for(const f of this.files){
      const nb=enc.encode(f.name),crc=crc32(f.data),len=f.data.length;
      const lh=new Uint8Array(30+nb.length),d=new DataView(lh.buffer);
      d.setUint32(0,0x04034b50,true);d.setUint16(4,20,true);d.setUint16(6,0x0800,true);
      d.setUint32(14,crc,true);d.setUint32(18,len,true);d.setUint32(22,len,true);d.setUint16(26,nb.length,true);lh.set(nb,30);
      const ch=new Uint8Array(46+nb.length),c=new DataView(ch.buffer);
      c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);
      c.setUint32(16,crc,true);c.setUint32(20,len,true);c.setUint32(24,len,true);c.setUint16(28,nb.length,true);c.setUint32(42,offset,true);ch.set(nb,46);
      parts.push(lh,f.data);central.push(ch);offset+=lh.length+len;
    }
    let cdSize=0;for(const ch of central){parts.push(ch);cdSize+=ch.length;}
    const e=new Uint8Array(22),ev=new DataView(e.buffer);
    ev.setUint32(0,0x06054b50,true);ev.setUint16(8,this.files.length,true);ev.setUint16(10,this.files.length,true);ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);
    parts.push(e);return this.concat(parts);
  }
  concat(arrays){
    let total=0;for(const a of arrays)total+=a.length;
    const result=new Uint8Array(total);
    let offset=0;
    for(const a of arrays){result.set(a,offset);offset+=a.length;}
    return result;
  }
}

// === MODULE: Simple ZIP Reader (minimal) ===
class SimpleUnzip{
  constructor(data){
    this.data=data;
    this.files={};
    this.parse();
  }
  parse(){
    const dv=new DataView(this.data.buffer);
    // Find end of central directory
    let eocd=-1;
    for(let i=this.data.length-22;i>=0;i--){
      if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
    }
    if(eocd<0)return;
    const cdOffset=dv.getUint32(eocd+16,true);
    const cdSize=dv.getUint32(eocd+12,true);
    let pos=cdOffset;
    while(pos<cdOffset+cdSize){
      if(dv.getUint32(pos,true)!==0x02014b50)break;
      const nameLen=dv.getUint16(pos+28,true);
      const extraLen=dv.getUint16(pos+30,true);
      const commentLen=dv.getUint16(pos+32,true);
      const localOffset=dv.getUint32(pos+42,true);
      const nameBytes=this.data.slice(pos+46,pos+46+nameLen);
      const name=new TextDecoder().decode(nameBytes);
      // Read local header
      const lhNameLen=dv.getUint16(localOffset+26,true);
      const lhExtraLen=dv.getUint16(localOffset+28,true);
      const compSize=dv.getUint32(pos+20,true);
      const method=dv.getUint16(localOffset+8,true);
      const dataStart=localOffset+30+lhNameLen+lhExtraLen;
      let fileData;
      if(method===0){
        fileData=this.data.slice(dataStart,dataStart+compSize);
      }else if(method===8){
        // DEFLATE — use browser's DecompressionStream if available
        fileData=null; // Will handle async below
      }
      this.files[name]={data:fileData,method,dataStart,compSize};
      pos+=46+nameLen+extraLen+commentLen;
    }
  }
  async readAsync(name){
    const f=this.files[name];if(!f)return null;
    const raw=this.data.slice(f.dataStart,f.dataStart+f.compSize);
    if(f.method===0)return new TextDecoder().decode(raw);
    if(f.method===8&&window.DecompressionStream){
      const st=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return await new Response(st).text();
    }
    return null;
  }
  read(name){
    const f=this.files[name];
    if(!f)return null;
    if(f.method===0&&f.data){
      return new TextDecoder().decode(f.data);
    }
    if(f.method===8){
      // Synchronous fallback: try to inflate using pako-like approach
      // Since we can't use external libs, use DecompressionStream (async not suitable here)
      // Fallback: return null for compressed
      return null;
    }
    return null;
  }
}

  attachEvents(){
    const wrap=document.getElementById('gridwrap');
    const canvas=document.getElementById('gridwrap');
    const ed=document.getElementById('celleditor');
    const fi=document.getElementById('formulainput');
    const nb=document.getElementById('namebox');

        // Mouse on grid
    let mouseDown=false,dragStartCell=null,isDragging=false;
    let mousePos={x:0,y:0};
    let autoScrollId=null;

    // Bucle de auto-scroll mientras se arrastra la selección
    const autoScrollLoop=()=>{
      // Añade '&& !FillHandle.dragging' a la condición
      if((!mouseDown||!dragStartCell) && !FillHandle.dragging){
        autoScrollId=null;
        return;
      }
      const wrap=document.getElementById('gridwrap');
      const rect=wrap.getBoundingClientRect();
      let dx=0,dy=0;
      const speed=15; // Velocidad del scroll
      const edge=30;  // Distancia a los bordes para activar el scroll (px)

      if(mousePos.y>rect.bottom-edge)dy=speed;
      else if(mousePos.y<rect.top+edge)dy=-speed;

      if(mousePos.x>rect.right-edge)dx=speed;
      else if(mousePos.x<rect.left+edge)dx=-speed;

      if(dx!==0||dy!==0){
        wrap.scrollLeft+=dx;
        wrap.scrollTop+=dy;
        const mx=mousePos.x-rect.left;
        const my=mousePos.y-rect.top;
        const hit=Grid.hitTest(mx,my);
        if(hit.type==='cell'){
          if(FillHandle.dragging){ // NUEVO
            State.selection.start = { r: FillHandle.sourceR0, c: FillHandle.sourceC0 };
            State.selection.end = { r: hit.row, c: hit.col };
          } else {
            State.selection.start=dragStartCell;
            State.selection.end={r:hit.row,c:hit.col};
          }
          Grid.needsRender=true;
          UI.updateStatusBar();
        }
      }
      autoScrollId=requestAnimationFrame(autoScrollLoop);
    };

    canvas.addEventListener('mousedown',(e)=>{
      if(e.target!==canvas&&e.target.id!=='gridspacer')return;
      const rr=canvas.getBoundingClientRect();
      if(e.clientX-rr.left>canvas.clientWidth||e.clientY-rr.top>canvas.clientHeight)return;
      if(State.editing){Editor.finishEditing();}
      const rect=canvas.getBoundingClientRect();
      const mx=e.clientX-rect.left,my=e.clientY-rect.top;
      const hit=Grid.hitTest(mx,my);
      if(hit.type==='cell'){
        const valid = Validation.getValidation(getActiveSheet(), hit.row, hit.col);
        if (valid && valid.type === 'list') {
          const cellX = Grid.colX(hit.col);
          const cellY = Grid.rowY(hit.row);
          const cellW = Grid.colWidth(hit.col);
          const cellH = Grid.rowHeight(hit.row);
          const z = State.zoom;
          const clickX = (e.clientX - rect.left) / z + canvas.scrollLeft / z;
          const clickY = (e.clientY - rect.top) / z + canvas.scrollTop / z;
          
          // Si el clic está en la esquina inferior derecha (15x15 px)
          if (clickX > cellX + cellW - 15 && clickY > cellY + cellH - 15) {
            this.showValidationDropdown(hit.row, hit.col, valid.params.values);
            return; // Detener ejecución para que no seleccione ni edite
          }
        }
        const fh=document.querySelector('.fillhandle');
        if(fh&&fh.style.display!=='none'){
          const fr=fh.getBoundingClientRect();
          if(Math.abs(e.clientX-fr.left)<8&&Math.abs(e.clientY-fr.top)<8){ // Un poco más de margen (8px)
            FillHandle.dragging=true;
            FillHandle.startR=hit.row;FillHandle.startC=hit.col;
            
            // NUEVO: Guardar el rango original
            const rng = Sel.getSelectedRange();
            FillHandle.sourceR0 = rng.r0;
            FillHandle.sourceR1 = rng.r1;
            FillHandle.sourceC0 = rng.c0;
            FillHandle.sourceC1 = rng.c1;

            mousePos={x:e.clientX,y:e.clientY};
            if(!autoScrollId)autoScrollId=requestAnimationFrame(autoScrollLoop); // Activar scroll automático

            e.preventDefault();return;
          }
        }
        if(e.shiftKey){
          Sel.moveActive(0,0,true);
          State.selection.end={r:hit.row,c:hit.col};
          Grid.needsRender=true;
        }else{
          Sel.selectCell(hit.row,hit.col);
          mouseDown=true;
          dragStartCell={r:hit.row,c:hit.col};
          mousePos={x:e.clientX,y:e.clientY};
          // Iniciar el bucle de auto-scroll
          if(!autoScrollId)autoScrollId=requestAnimationFrame(autoScrollLoop);
        }
      }else if(hit.type==='colheader'){
        if(e.shiftKey){
          State.selection.end={r:MAX_ROWS-1,c:hit.col};
        }else{
          Sel.selectRange(0,hit.col,MAX_ROWS-1,hit.col);
        }
        Grid.needsRender=true;
      }else if(hit.type==='rowheader'){
        if(e.shiftKey){
          State.selection.end={r:hit.row,c:MAX_COLS-1};
        }else{
          Sel.selectRange(hit.row,0,hit.row,MAX_COLS-1);
        }
        Grid.needsRender=true;
      }else if(hit.type==='corner'){
        Sel.selectRange(0,0,MAX_ROWS-1,MAX_COLS-1);
        Grid.needsRender=true;
      }
    });

    // Cambiamos el mousemove al document para que siga rastreando el mouse fuera del canvas
    document.addEventListener('mousemove',(e)=>{
      mousePos={x:e.clientX,y:e.clientY};

      if(FillHandle.dragging){
        const rect=canvas.getBoundingClientRect();
        const hit=Grid.hitTest(e.clientX-rect.left,e.clientY-rect.top);
        if(hit.type==='cell'){
State.selection.start = { r: FillHandle.sourceR0, c: FillHandle.sourceC0 };
          State.selection.end = { r: hit.row, c: hit.col };
          Grid.needsRender=true;
          UI.updateStatusBar();
        }
        return;
      }      
      if(mouseDown&&dragStartCell){
        const rect=canvas.getBoundingClientRect();
        const hit=Grid.hitTest(e.clientX-rect.left,e.clientY-rect.top);
        if(hit.type==='cell'){
          State.selection.start=dragStartCell;
          State.selection.end={r:hit.row,c:hit.col};
          isDragging=true;
          Grid.needsRender=true;
          UI.updateStatusBar();
        }
      }
    });

        document.addEventListener('mouseup',(e)=>{
      // NUEVO: Aplicar el relleno al soltar el mouse

           if(FillHandle.dragging){
        const rect=canvas.getBoundingClientRect();
        const hit=Grid.hitTest(e.clientX-rect.left,e.clientY-rect.top);
        if(hit.type==='cell'){
          FillHandle.apply(hit.row,hit.col);
        } else {
          // Si suelta fuera de la tabla, restauramos la selección original
          Sel.selectRange(FillHandle.sourceR0, FillHandle.sourceC0, FillHandle.sourceR1, FillHandle.sourceC1);
        }
        FillHandle.dragging=false;
      }

      mouseDown=false;dragStartCell=null;isDragging=false;
      if(autoScrollId){cancelAnimationFrame(autoScrollId);autoScrollId=null;}
    });

        canvas.addEventListener('dblclick',(e)=>{
      const rect=canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const hit=Grid.hitTest(mx,my);
      
      if(hit.type==='colheader'){
        // Detectar si el doble clic fue cerca del borde derecho de la columna
        const x = Grid.colX(hit.col) + Grid.colWidth(hit.col);
        const z = State.zoom;
        // Si el clic está a menos de 5px del borde (escalado por el zoom)
        if (Math.abs((mx / z + canvas.parentElement.scrollLeft / z) - x) < 5) {
          Grid.autoFitColumn(hit.col);
          return;
        }
      }
      
      if(hit.type==='cell')Editor.startEditing();
    });

    // Doble toque (celular) para editar la celda
    let lastTap=0,lastCell=null;
    canvas.addEventListener('click',(e)=>{
      if(e.target!==canvas&&e.target.id!=='gridspacer')return;
      const rect=canvas.getBoundingClientRect();
      const hit=Grid.hitTest(e.clientX-rect.left,e.clientY-rect.top);
      if(hit.type!=='cell')return;
      const now=Date.now(),key=hit.row+','+hit.col;
      if(now-lastTap<350&&key===lastCell&&e.detail<2)Editor.startEditing();
      lastTap=now;lastCell=key;
    });
    // Táctil: mantén presionado una celda y arrastra para seleccionar; pellizca para hacer zoom
    let tState=null,suppressCtx=0;
    const tCell=(t)=>{const r=canvas.getBoundingClientRect();return Grid.hitTest(t.clientX-r.left,t.clientY-r.top);};
    canvas.addEventListener('touchstart',(e)=>{
      if(tState&&tState.timer)clearTimeout(tState.timer);
      if(e.touches.length===2){
        const a=e.touches[0],b=e.touches[1];
        tState={pinch:true,d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z0:State.zoom};return;
      }
      if(e.touches.length!==1||(e.target!==canvas&&e.target.id!=='gridspacer')){tState=null;return;}
      const t=e.touches[0],hit=tCell(t);
      tState={x:t.clientX,y:t.clientY,selecting:false,dragged:false};
      if(hit.type==='cell')tState.timer=setTimeout(()=>{
        if(!tState)return;
        tState.selecting=true;tState.start={r:hit.row,c:hit.col};
        if(State.editing)Editor.finishEditing();
        Sel.selectCell(hit.row,hit.col);
        if(navigator.vibrate)navigator.vibrate(15);
      },350);
    },{passive:true});
    canvas.addEventListener('touchmove',(e)=>{
      if(!tState)return;
      if(tState.pinch){
        if(e.touches.length!==2)return;
        e.preventDefault();
        const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
        const nz=U.clamp(tState.z0*d/tState.d0,0.5,3);
        const rect=canvas.getBoundingClientRect(),px=(a.clientX+b.clientX)/2-rect.left,py=(a.clientY+b.clientY)/2-rect.top;
        const cx=(canvas.scrollLeft+px)/State.zoom,cy=(canvas.scrollTop+py)/State.zoom;
        State.zoom=nz;Grid.needsRender=true;Grid.render();
        canvas.scrollLeft=cx*nz-px;canvas.scrollTop=cy*nz-py;
        Grid.needsRender=true;UI.updateZoom();return;
      }
      const t=e.touches[0];
      if(!tState.selecting){
        if(Math.hypot(t.clientX-tState.x,t.clientY-tState.y)>8)clearTimeout(tState.timer);
        return;
      }
      e.preventDefault();tState.dragged=true;
      const rect=canvas.getBoundingClientRect(),hit=tCell(t);
      if(t.clientY>rect.bottom-30)canvas.scrollTop+=14;else if(t.clientY<rect.top+Grid.headerH*State.zoom+20)canvas.scrollTop-=14;
      if(t.clientX>rect.right-30)canvas.scrollLeft+=14;else if(t.clientX<rect.left+Grid.cornerW*State.zoom+20)canvas.scrollLeft-=14;
      if(hit.type==='cell'){State.selection.start=tState.start;State.selection.end={r:hit.row,c:hit.col};Grid.needsRender=true;UI.updateStatusBar();}
    },{passive:false});
    const tEnd=(e)=>{
      if(!tState)return;
      clearTimeout(tState.timer);
      const st=tState;tState=null;
      if(st.selecting){
        suppressCtx=Date.now();
        if(e.cancelable)e.preventDefault();
        // Mantener sin arrastrar abre el menú contextual
        if(!st.dragged&&e.type==='touchend'&&e.changedTouches[0])this.showContextMenu(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
      }
    };
    canvas.addEventListener('touchend',tEnd,{passive:false});
    canvas.addEventListener('touchcancel',tEnd,{passive:false});
        // NUEVO: Contextmenu global para toda la tabla (evita el menú del navegador en los bordes)
    document.addEventListener('contextmenu', (e) => {
      if (!e.target.closest('#gridwrap') && !e.target.closest('#gridhost')) return;
      e.preventDefault(); // Evita el menú del navegador
      
      if ((tState && tState.selecting) || Date.now() - suppressCtx < 600) return;
      const rect = canvas.getBoundingClientRect();
      const hit = Grid.hitTest(e.clientX - rect.left, e.clientY - rect.top);
      if (hit.type === 'cell') {
        if (!Sel.isSelected(hit.row, hit.col)) Sel.selectCell(hit.row, hit.col);
        this.showContextMenu(e.clientX, e.clientY);
      }
    });

    // Column/row resize
    let resizing=null;
    canvas.addEventListener('mousedown',(e)=>{
      const rect=canvas.getBoundingClientRect();
      const mx=e.clientX-rect.left,my=e.clientY-rect.top;
      const hit=Grid.hitTest(mx,my);
      if(hit.type==='colheader'){
        const x=Grid.colX(hit.col)+Grid.colWidth(hit.col);
        if(Math.abs(mx-x)<4){resizing={type:'col',col:hit.col,startX:e.clientX,startW:Grid.colWidth(hit.col)};e.preventDefault();}
      }
      if(hit.type==='rowheader'){
        const y=Grid.rowY(hit.row)+Grid.rowHeight(hit.row);
        if(Math.abs(my-y)<4){resizing={type:'row',row:hit.row,startY:e.clientY,startH:Grid.rowHeight(hit.row)};e.preventDefault();}
      }
    });
    document.addEventListener('mousemove',(e)=>{
      if(!resizing)return;
      if(resizing.type==='col'){
        const w=Math.max(20,resizing.startW+e.clientX-resizing.startX);
        getActiveSheet().colWidths[resizing.col]=w;
        Grid.needsRender=true;
      }
      if(resizing.type==='row'){
        const h=Math.max(16,resizing.startH+e.clientY-resizing.startY);
        getActiveSheet().rowHeights[resizing.row]=h;
        Grid.needsRender=true;
      }
    });
    document.addEventListener('mouseup',()=>{if(resizing){resizing=null;Storage.saveDebounced();}});

    // Name box
    nb.addEventListener('keydown',(e)=>{

// Click outside context menu (ignorar clicks DENTRO de toolbar/picker/menu)
document.addEventListener('click',(e)=>{

    // NUEVO: Función para mostrar el menú de validación
    this.showValidationDropdown = function(r, c, values) {
      const existing = document.getElementById('val-dropdown');
      if (existing) existing.remove();

      const sel = document.createElement('select');
      sel.id = 'val-dropdown';
      sel.style.position = 'absolute';
      sel.style.zIndex = '100';
      sel.style.fontSize = '13px';
      sel.style.border = '2px solid var(--sel)';
      
      const z = State.zoom;
      const x = Grid.colX(c) * z - wrap.scrollLeft;
      const y = Grid.rowY(r) * z - wrap.scrollTop;
      const w = Grid.colWidth(c) * z;
      const h = Grid.rowHeight(r) * z;

      sel.style.left = x + 'px';
      sel.style.top = (y + h) + 'px';
      sel.style.width = Math.max(w, 60) + 'px';

      // Opción vacía por defecto
      const opt0 = document.createElement('option');
      opt0.value = ''; opt0.textContent = '--';
      sel.appendChild(opt0);

      values.forEach(v => {

        sel.appendChild(opt);
      });

        Formula.recalc(getActiveSheet());
        Grid.needsRender = true;
        Storage.saveDebounced();

      });

    // Leer portapapeles del sistema (permite pegar tablas con formato desde Excel/Web)
    document.addEventListener('paste',(e)=>{
      if(State.editing||document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')return;
      
      const html=e.clipboardData.getData('text/html');
      const text=e.clipboardData.getData('text/plain');
      
      if(html && html.includes('<table')){
        e.preventDefault();
        History.snapshot();
        const parser=new DOMParser();
        const doc=parser.parseFromString(html,'text/html');
        const table=doc.querySelector('table');
        const destR=State.selection.activeCell.r;
        const destC=State.selection.activeCell.c;
        const sheet=getActiveSheet();
        
        const rows=table.querySelectorAll('tr');
	const affectedCols = new Set();
        rows.forEach((tr,r)=>{
          const cells=tr.querySelectorAll('td,th');
          cells.forEach((td,c)=>{
            const cell=getOrCreateCell(sheet,destR+r,destC+c);
            cell.v=td.textContent.trim();
            if(!cell.fmt)cell.fmt={};
            
            const styleStr=td.getAttribute('style')||'';
            
            // Leer color de fondo
            const bgMatch=styleStr.match(/background(?:-color)?:\s*([^;]+)/i);
            if(bgMatch)cell.fmt.bg=bgMatch[1];
            
            // Leer color del texto
            const colorMatch=styleStr.match(/(?<!-)\bcolor:\s*([^;]+)/i);
            if(colorMatch)cell.fmt.color=colorMatch[1];
            
            // Leer negritas/cursivas
            if(styleStr.includes('font-weight:bold')||styleStr.includes('font-weight: bold')||td.tagName==='TH')cell.fmt.bold=true;
            if(styleStr.includes('font-style:italic')||styleStr.includes('font-style: italic'))cell.fmt.italic=true;
            
            // Si tiene cualquier borde, se lo asignamos
            if(styleStr.includes('border')||td.getAttribute('border')){
              cell.fmt.borders={top:'thin',bottom:'thin',left:'thin',right:'thin',borderColor:'#888'};
            }
          });
        });
        const maxCols = Math.max(...Array.from(rows).map(tr => tr.querySelectorAll('td,th').length));
        for(let i=0; i<maxCols; i++) affectedCols.add(destC + i);
        affectedCols.forEach(c => Grid.autoFitColumn(c));

        Formula.recalc(sheet);
        Grid.needsRender=true;
        Storage.saveDebounced();
        UI.setSaveIndicator(false);
        UI.updateFormulaBar();
      }else if(text){
        // Pegar texto plano (TSV) si no hay tabla HTML
        e.preventDefault();
        History.snapshot();
        const destR=State.selection.activeCell.r;
        const destC=State.selection.activeCell.c;
        const sheet=getActiveSheet();
        const rows=text.split(/\r?\n/).filter(r=>r.trim()!=='');
        const affectedCols = new Set();
        rows.forEach((row,r)=>{
          const cells=row.split('\t');
          cells.forEach((val,c)=>{
            Editor.setCellValue(sheet,destR+r,destC+c,val);
	    affectedCols.add(destC + c);
          });
        });
         affectedCols.forEach(c => Grid.autoFitColumn(c));

        Formula.recalc(sheet);
        Grid.needsRender=true;
        Storage.saveDebounced();
        UI.setSaveIndicator(false);
        UI.updateFormulaBar();
      }
    });
    document.body.appendChild(fileInput);
  },

  handleKeyDown(e){
    // NUEVO: Forzar el buscador de la app, anulando el del navegador
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
      if (document.activeElement.tagName === 'INPUT' && document.activeElement.id === 'formulainput') return;
      e.preventDefault();
      this.findDialog(false);
      return;
    }

    if(State.editing||document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA'||document.activeElement.tagName==='SELECT')return;
    const sel=State.selection;
    switch(e.key){
            case'ArrowUp':
        e.preventDefault();
        if(e.ctrlKey||e.metaKey) Sel.jumpToEdge(-1,0,e.shiftKey);
        else Sel.moveActive(-1,0,e.shiftKey);
        break;
      case'ArrowDown':
        e.preventDefault();
        if(e.ctrlKey||e.metaKey) Sel.jumpToEdge(1,0,e.shiftKey);
        else Sel.moveActive(1,0,e.shiftKey);
        break;
      case'ArrowLeft':
        e.preventDefault();
        if(e.ctrlKey||e.metaKey) Sel.jumpToEdge(0,-1,e.shiftKey);
        else Sel.moveActive(0,-1,e.shiftKey);
        break;
      case'ArrowRight':
        e.preventDefault();
        if(e.ctrlKey||e.metaKey) Sel.jumpToEdge(0,1,e.shiftKey);
        else Sel.moveActive(0,1,e.shiftKey);
        break;
      case'Tab':e.preventDefault();Sel.moveActive(0,1);break;
      case'Enter':e.preventDefault();Sel.moveActive(1,0);break;
            case'Escape':
        State.showCopyBorder = false; // <--- Quita el borde
        Grid.needsRender = true;
        Sel.selectCell(sel.activeCell.r,sel.activeCell.c);
        break;
      case'PageUp':e.preventDefault();Sel.moveActive(-20,0,e.shiftKey);break;
      case'PageDown':e.preventDefault();Sel.moveActive(20,0,e.shiftKey);break;
      case'Home':e.preventDefault();Sel.selectCell(sel.activeCell.r,0);break;
      case'End':e.preventDefault();Sel.selectCell(sel.activeCell.r,MAX_COLS-1);break;
      case'F2':e.preventDefault();Editor.startEditing();break;
      case'Delete':case'Backspace':e.preventDefault();this.deleteSelection();break;
      default:
        // Ctrl combos
        if(e.ctrlKey||e.metaKey){
          if(e.key==='c'){e.preventDefault();Clip.copy();}
          else if(e.key==='x'){e.preventDefault();Clip.cut();}
                else if(e.key==='v'){
        if(e.shiftKey){
          e.preventDefault();
          Format.painterApply();
        } else if(State.clipboard){
          // Solo bloquea el pegado nativo si hay algo copiado internamente
          e.preventDefault();
          Clip.paste();
        }
      }
          else if(e.key==='z'){e.preventDefault();History.undo();}
          else if(e.key==='y'){e.preventDefault();History.redo();}
          else if(e.key==='b'){e.preventDefault();Format.toggleBold();}
          else if(e.key==='i'){e.preventDefault();Format.toggleItalic();}
          else if(e.key==='u'){e.preventDefault();Format.toggleUnderline();}
          else if(e.key==='f'){e.preventDefault();this.findDialog(false);}
          else if(e.key==='h'){e.preventDefault();this.findDialog(true);}
          else if(e.key==='s'){e.preventDefault();Storage.save();UI.toast('Guardado');}
          else if(e.key==='a'){e.preventDefault();Sel.selectRange(0,0,MAX_ROWS-1,MAX_COLS-1);}
        }else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
	  e.preventDefault();                 // ← clave: evita que el navegador re-escriba la tecla
 		   Editor.startEditing(e.key);
	}
    }
  },

  deleteSelection(){
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    const sheet=getActiveSheet();
    History.snapshot();
    for(let r=r0;r<=r1;r++){
      for(let c=c0;c<=c1;c++){
        const merge=Grid.getMergeAt(sheet,r,c);
        const rr=merge?merge.r:r,cc=merge?merge.c:c;
        delete sheet.cells[cellKey(rr,cc)];
      }
    }
    Formula.recalc(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },

  updateFormulaBar(){
    const sel=State.selection.activeCell;
    const sheet=getActiveSheet();
    const cell=getCell(sheet,sel.r,sel.c);
    const nb=document.getElementById('namebox');
    const fi=document.getElementById('formulainput');
    // Check merge
    const merge=Grid.getMergeAt(sheet,sel.r,sel.c);
    if(merge){nb.value=U.colToLetter(merge.c)+(merge.r+1)+':'+U.colToLetter(merge.c+merge.cs-1)+(merge.r+merge.rs);}
    else{nb.value=U.addr(sel.r,sel.c);}
    fi.value=cell?(cell.f||String(cell.v??'')):'';
      this.syncToolbar();

    syncToolbar(){
    if (!this.el.tbBold) {
      // Guardar en caché la primera vez
      this.el.tbBold = document.querySelector('.tbtn[title^="Negrita"]');
      this.el.tbItalic = document.querySelector('.tbtn[title^="Cursiva"]');
      this.el.tbUnderline = document.querySelector('.tbtn[title^="Subrayado"]');
      this.el.tbStrike = document.querySelector('.tbtn[title^="Tachado"]');
      this.el.tbAlignLeft = document.querySelector('.tbtn[title="Alinear a la izquierda"]');
      this.el.tbAlignCenter = document.querySelector('.tbtn[title="Centrar"]');
      this.el.tbAlignRight = document.querySelector('.tbtn[title="Alinear a la derecha"]');
      this.el.tbFont = document.getElementById('tb-font');
      this.el.tbSize = document.getElementById('tb-size');
      this.el.tbFormat = document.getElementById('tb-format');
    }

    const sel = State.selection.activeCell;
    const sheet = getActiveSheet();
    const cell = getCell(sheet, sel.r, sel.c);
    const fmt = cell ? (cell.fmt || {}) : {};

    // Usar la caché (this.el) en lugar de document.querySelector
    if(this.el.tbBold) this.el.tbBold.classList.toggle('active', !!fmt.bold);
    if(this.el.tbItalic) this.el.tbItalic.classList.toggle('active', !!fmt.italic);
    if(this.el.tbUnderline) this.el.tbUnderline.classList.toggle('active', !!fmt.underline);
    if(this.el.tbStrike) this.el.tbStrike.classList.toggle('active', !!fmt.strike);

    const defaultAlign = (typeof cell?.v === 'number') ? 'right' : 'left';
    const currentAlign = fmt.align || defaultAlign;
    
    if(this.el.tbAlignLeft) this.el.tbAlignLeft.classList.toggle('active', currentAlign === 'left');
    if(this.el.tbAlignCenter) this.el.tbAlignCenter.classList.toggle('active', currentAlign === 'center');
    if(this.el.tbAlignRight) this.el.tbAlignRight.classList.toggle('active', currentAlign === 'right');

    if(this.el.tbFont) this.el.tbFont.value = fmt.font || 'Segoe UI';
    if(this.el.tbSize) this.el.tbSize.value = fmt.size || 11;
    if(this.el.tbFormat) this.el.tbFormat.value = fmt.format || 'General';
  },

  updateStatusBar(){
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    const sheet=getActiveSheet();
    const nums=[];
    let count=0;
    for(let r=r0;r<=r1;r++){
      for(let c=c0;c<=c1;c++){
        const cell=getCell(sheet,r,c);
        if(cell&&cell.v!==''&&cell.v!==undefined){count++;if(typeof cell.v==='number')nums.push(cell.v);}
      }
    }
    const el=document.getElementById('selstats');
    if(r0===r1&&c0===c1){el.textContent='Listo';return;}
    let stats=`Cuenta: ${count}`;
    if(nums.length){
      const sum=nums.reduce((a,b)=>a+b,0);
      const avg=sum/nums.length;
      stats+=`  |  Suma: ${sum.toFixed(2).replace(/\.00$/,'')}`;
      stats+=`  |  Prom: ${avg.toFixed(2)}`;
      stats+=`  |  Mín: ${Math.min(...nums)}`;
      stats+=`  |  Máx: ${Math.max(...nums)}`;
    }
    el.textContent=stats;
  },

  updateZoom(){
    document.getElementById('zoomval').textContent=Math.round(State.zoom*100)+'%';
    Grid.needsRender=true;
  },

  // === Context Menu ===
  showContextMenu(x,y){
    const menu=document.getElementById('ctxmenu');
    const items=[
      {label:'Cortar',key:'Ctrl+X',fn:()=>Clip.cut()},
      {label:'Copiar',key:'Ctrl+C',fn:()=>Clip.copy()},
      {label:'Pegar',key:'Ctrl+V',fn:()=>Clip.paste()},
      {sep:true},
      {label:'Insertar fila',key:'',fn:()=>this.insertRow()},
      {label:'Eliminar fila',key:'',fn:()=>this.deleteRow()},
      {label:'Insertar columna',key:'',fn:()=>this.insertCol()},
      {label:'Eliminar columna',key:'',fn:()=>this.deleteCol()},
      {sep:true},
      {label:'Formato de celdas...',key:'',fn:()=>this.formatDialog()},
      {label:'Combinar celdas',key:'',fn:()=>Format.mergeSelection()},
      {label:'Separar celdas',key:'',fn:()=>Format.unmergeSelection()},
      {sep:true},
      {label:'Agregar comentario',key:'',fn:()=>this.addComment()},
      {label:'Editar/Eliminar comentario',key:'',fn:()=>this.editComment()},
      {sep:true},
      {label:'Insertar gráfica',key:'',fn:()=>Charts.create('bar')},
      {label:'Crear tabla dinámica',key:'',fn:()=>this.pivotDialog()},
      {label:'Validación de datos...',key:'',fn:()=>this.validationDialog()},
    ];
    menu.innerHTML='';
    for(const item of items){
      if(item.sep){const s=document.createElement('div');s.className='ctxsep';menu.appendChild(s);continue;}
      const el=document.createElement('div');
      el.className='ctxitem';
      el.innerHTML=`<span>${item.label}</span><span class="ctxkey">${item.key}</span>`;
      el.addEventListener('click',()=>{this.hideContextMenu();item.fn();});
      menu.appendChild(el);
    }
        menu.style.display='block';
    
    // --- Lógica para evitar que se salga de la pantalla ---
    // Primero lo posicionamos en 0,0 temporalmente para medir su tamaño real
    menu.style.left = '0px';
    menu.style.top = '0px';
    const menuW = menu.offsetWidth;
    const menuH = menu.offsetHeight;
    const winW = window.innerWidth;
    const winH = window.innerHeight;

    let finalX = x;
    let finalY = y;

    // Si se sale por la derecha, lo movemos a la izquierda
    if (x + menuW > winW) {
      finalX = Math.max(0, winW - menuW - 5);
    }
    // Si se sale por abajo, lo movemos hacia arriba
    if (y + menuH > winH) {
      finalY = Math.max(0, winH - menuH - 5);
    }

    menu.style.left = finalX + 'px';
    menu.style.top = finalY + 'px';
    // -----------------------------------------------------

    State.contextMenuOpen=true;
  },
  hideContextMenu(){document.getElementById('ctxmenu').style.display='none';State.contextMenuOpen=false;},

  sheetContextMenu(e,idx){
    const menu=document.getElementById('ctxmenu');
    menu.innerHTML='';
    const items=[
      {label:'Renombrar',fn:()=>{const n=prompt('Nombre:',State.workbook.sheets[idx].name);if(n)Sheets.rename(idx,n);}},
      {label:'Eliminar',fn:()=>{if(confirm('¿Eliminar hoja?'))Sheets.delete(idx);}},
      {label:'Duplicar',fn:()=>{const s=U.deepClone(State.workbook.sheets[idx]);s.name+='_copia';s.id=U.uid();State.workbook.sheets.push(s);UI.renderSheetTabs();Storage.saveDebounced();}},
    ];
    for(const item of items){
      const el=document.createElement('div');el.className='ctxitem';el.innerHTML=`<span>${item.label}</span>`;
      el.addEventListener('click',()=>{this.hideContextMenu();item.fn();});
      menu.appendChild(el);
    }
        menu.style.display='block';

    // --- Lógica para evitar que se salga de la pantalla ---
    menu.style.left = '0px';
    menu.style.top = '0px';
    const menuW = menu.offsetWidth;
    const menuH = menu.offsetHeight;
    const winW = window.innerWidth;
    const winH = window.innerHeight;

    let finalX = e.clientX;
    let finalY = e.clientY;

    if (e.clientX + menuW > winW) {
      finalX = Math.max(0, winW - menuW - 5);
    }
    if (e.clientY + menuH > winH) {
      finalY = Math.max(0, winH - menuH - 5);
    }

    menu.style.left = finalX + 'px';
    menu.style.top = finalY + 'px';
    // -----------------------------------------------------
  },

  // === Row/Col Insert/Delete ===
  insertRow(){
    const r=State.selection.activeCell.r;
    const sheet=getActiveSheet();
    History.snapshot();
    // Shift all cells down
    const newCells={};
    for(const k in sheet.cells){
      const[kr,kc]=k.split(',').map(Number);
      if(kr>=r)newCells[cellKey(kr+1,kc)]=sheet.cells[k];
      else newCells[k]=sheet.cells[k];
    }
    sheet.cells=newCells;
    // Shift merges
    const newMerges={};
    for(const k in sheet.merges){const m=sheet.merges[k];if(m.r>=r)m.r++;newMerges[cellKey(m.r,m.c)]=m;}
    sheet.merges=newMerges;
    Formula.recalc(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },
  deleteRow(){
    const r=State.selection.activeCell.r;
    const sheet=getActiveSheet();
    History.snapshot();
    const newCells={};
    for(const k in sheet.cells){
      const[kr,kc]=k.split(',').map(Number);
      if(kr===r)continue;
      if(kr>r)newCells[cellKey(kr-1,kc)]=sheet.cells[k];
      else newCells[k]=sheet.cells[k];
    }
    sheet.cells=newCells;
    Formula.recalc(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },
  insertCol(){
    const c=State.selection.activeCell.c;
    const sheet=getActiveSheet();
    History.snapshot();
    const newCells={};
    for(const k in sheet.cells){
      const[kr,kc]=k.split(',').map(Number);
      if(kc>=c)newCells[cellKey(kr,kc+1)]=sheet.cells[k];
      else newCells[k]=sheet.cells[k];
    }
    sheet.cells=newCells;
    Formula.recalc(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },
  deleteCol(){
    const c=State.selection.activeCell.c;
    const sheet=getActiveSheet();
    History.snapshot();
    const newCells={};
    for(const k in sheet.cells){
      const[kr,kc]=k.split(',').map(Number);
      if(kc===c)continue;
      if(kc>c)newCells[cellKey(kr,kc-1)]=sheet.cells[k];
      else newCells[k]=sheet.cells[k];
    }
    sheet.cells=newCells;
    Formula.recalc(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },
};

UI.findDialog=function(replace){
  const body=`

  `;
  const footer=`<button class="dbtn" id="find_next">Buscar siguiente</button>${replace?'<button class="dbtn" id="find_rep">Reemplazar</button><button class="dbtn primary" id="find_all">Reemplazar todo</button>':''}<button class="dbtn" onclick="this.closest('.dialog').remove()">Cerrar</button>`;

    const q=d.querySelector('#find_query').value;

  }

  if(!Macros.saved.length){UI.toast('No hay macros. Crea una primero.');return;}
  const opts=Macros.saved.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  const body=`<div class="drow"><label>Elige la macro</label><select id="mb_macro">${opts}</select></div>
    <div class="drow"><label>Texto del botón</label><input type="text" id="mb_label" value="Ejecutar macro"></div>`;
  const footer='<button class="dbtn primary" id="mb_insert">Insertar botón</button><button class="dbtn" onclick="this.closest(\'.dialog\').remove()">Cancelar</button>';
  const d=this.dialog('Insertar botón de macro',body,footer);
  d.querySelector('#mb_insert').addEventListener('click',()=>{
    const macroId=d.querySelector('#mb_macro').value;
    const label=d.querySelector('#mb_label').value;
    const sel=State.selection.activeCell;
    const sheet=getActiveSheet();
    sheet.macroButtons=sheet.macroButtons||[];
    const btn={id:U.uid(),r:sel.r,c:sel.c,macroId,label};
    sheet.macroButtons.push(btn);
    Macros.renderButton(btn);
    Storage.saveDebounced();
    d.remove();
  });
};

UI.importFileDialog=function(type){
  const fi=document.getElementById('fileInput');
  if(type==='csv')fi.accept='.csv';
  else fi.accept='.xlsx';
  fi.click();
};

UI.workbookManager=function(){
  const wbs=Storage.listWorkbooks();
  let listHtml=wbs.map(w=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px solid #eee">
    <span>${w.name} <small style="color:#999">(${new Date(w.savedAt).toLocaleDateString()})</small></span>
    <span>
      <button class="dbtn" onclick="UI.loadWorkbook('${w.id}')">Cargar</button>
      <button class="dbtn" onclick="UI.renameWorkbook('${w.id}')">Renombrar</button>
      <button class="dbtn" onclick="UI.deleteWorkbook('${w.id}');UI.workbookManager()">Eliminar</button>
    </span></div>`).join('');
  if(!listHtml)listHtml='<p style="color:#999">No hay libros guardados.</p>';
  const body=`<div style="max-height:300px;overflow-y:auto">${listHtml}</div>
    <div class="drow" style="margin-top:12px"><label>Guardar el actual como:</label><input type="text" id="wb_name" placeholder="Nombre del libro"></div>`;
  const footer='<button class="dbtn primary" id="wb_save">Guardar actual</button><button class="dbtn" onclick="this.closest(\'.dialog\').remove()">Cerrar</button>';
  const d=this.dialog('Administrador de libros',body,footer);
  d.querySelector('#wb_save').addEventListener('click',()=>{
    const name=d.querySelector('#wb_name').value||State.workbook.name;
    State.workbook.name=name;
    Storage.save();
    UI.toast('Libro guardado');
    d.remove();
    this.workbookManager();
  });
};

UI.loadWorkbook=function(id){
  if(Storage.load(id)){
    State.activeSheet=State.workbook.active||0;
    State.selection={start:{r:0,c:0},end:{r:0,c:0},activeCell:{r:0,c:0}};
    Grid.needsRender=true;
    UI.renderSheetTabs();
    UI.updateFormulaBar();
    document.querySelectorAll('.dialog').forEach(d=>d.remove());
    UI.toast('Libro cargado');
  }
};
UI.renameWorkbook=function(id){
  const name=prompt('Nuevo nombre:');
  if(name)Storage.rename(id,name);
};
UI.deleteWorkbook=function(id){
  if(confirm('¿Eliminar este libro?'))Storage.delete(id);
};

// === MODULE: Initialization ===
function init(){
  // Load saved data
  Storage.init();
  Storage.loadLastActive();
  Macros.loadFromStorage();

  // Initialize modules
  Grid.init();
  UI.init();

  EMBED.apply();
  // Modo vista: bloquea toda interacción con la hoja (en captura) salvo scroll, pestañas y el propio botón
  ['keydown','mousedown','pointerdown','touchstart','click','dblclick','contextmenu'].forEach(t=>window.addEventListener(t,e=>{
    if(!EMBED.vista||e.target.closest?.('#vistabtn,.shtab,.dialog'))return;
    e.stopImmediatePropagation();
    if(t!=='click'||!e.target.closest?.('#gridwrap')||document.querySelector('.dialog'))return;
    const rc=e.target.closest('#gridwrap').getBoundingClientRect(),h=Grid.hitTest(e.clientX-rc.left,e.clientY-rc.top),y=(e.clientY-rc.top)/State.zoom;
    if(h.type==='colheader'||(h.type==='cell'&&(h.row===0||(getActiveSheet().freeze.rows&&y<Grid.headerH+Grid.rowHeight(0)))))UI.filterDialog(h.col);
  },true));
  document.getElementById('vistabtn').onclick=()=>ExcelClone.setVista(!EMBED.vista);
  ExcelClone.setVista(EMBED.vista);
  History.snapshot(true);

  // Start render loop
  Grid.loop();
  Charts.bindGlobalEvents();
  // Render any saved charts/macro buttons
  setTimeout(()=>{
    Charts.renderAll();
    Macros.renderAllButtons();
  },100);

  // Mark as saved initially
  UI.setSaveIndicator(true);

  // Avisar a la ventana que nos abrió (o al iframe padre) que ya estamos listos para recibir datos (excel:set)
  const host=window.opener||(window.parent!==window?window.parent:null);
  if(host)host.postMessage({type:'excel:ready'},'*');

  // Handle window beforeunload for unsaved changes
  // Guardado síncrono de seguridad al cerrar/ocultar la página
const flushSave=()=>{
    try{
        if(State.dirty && EMBED.guardar) Storage.save();
    }catch(err){ console.error('flush save', err); }
};
window.addEventListener('beforeunload',(e)=>{
    flushSave();
    if(State.dirty && EMBED.guardar){ e.preventDefault(); e.returnValue=''; }
});
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'hidden') flushSave();
});
}

// === API pública (para incrustar en otros HTML) ===
window.ExcelClone={
  getData(){return U.deepClone(State.workbook);},
  setData(wb){State.workbook=wb;State.activeSheet=0;State.history=[];State.historyIdx=-1;History.snapshot(true);Formula.recalcAll();UI.renderSheetTabs();UI.updateFormulaBar();Grid.needsRender=true;Storage.saveDebounced();},
  getCell(addr,sheet){const p=U.parseAddr(addr.toUpperCase()),c=getCell(getSheet(sheet),p.row,p.col);return c?c.v:'';},
  setCell(addr,val,sheet){const p=U.parseAddr(addr.toUpperCase()),sh=getSheet(sheet);Editor.setCellValue(sh,p.row,p.col,String(val));Formula.recalc(sh);Grid.needsRender=true;Storage.saveDebounced();},
  getRows(sheet){
    const sh=getSheet(sheet);let mr=-1,mc=-1;
    for(const k in sh.cells){const[r,c]=k.split(',').map(Number),v=sh.cells[k].v;if(v!==''&&v!==undefined){mr=Math.max(mr,r);mc=Math.max(mc,c);}}
    const out=[];for(let r=0;r<=mr;r++){const row=[];for(let c=0;c<=mc;c++){const x=getCell(sh,r,c);row.push(x?x.v:'');}out.push(row);}
    return out;
  },
  setVista(v){EMBED.vista=!!v;document.body.classList.toggle('vista',EMBED.vista);document.activeElement?.blur?.();document.getElementById('vistabtn').textContent=EMBED.vista?'✏️ Editar':'👁 Vista';Grid.resize();Grid.needsRender=true;},
  exportCSV(){IO.exportCSV();},
  setReadOnly(v){EMBED.readonly=!!v;document.getElementById('formulainput').readOnly=!!v;},
  onChange(fn){this._cbs.push(fn);},
  _cbs:[],
  _t:null,
  _notify(){
    clearTimeout(this._t);
    this._t=setTimeout(()=>{
      this._cbs.forEach(f=>{try{f();}catch(e){}});
      if(window.parent!==window)window.parent.postMessage({type:'excel:change'},'*');
    },300);
  },
};
window.addEventListener('error',(e)=>{if(String(e.message).includes('__RO__')){e.preventDefault();UI.toast('Solo lectura');}});
// Para usarlo dentro de un <iframe>: postMessage({type:'excel:get'}) responde {type:'excel:data',data}; {type:'excel:set',data} carga datos
window.addEventListener('message',(e)=>{
  const m=e.data||{};
  if(m.type==='excel:get'&&e.source)e.source.postMessage({type:'excel:data',data:ExcelClone.getData()},'*');
  else if(m.type==='excel:set'&&m.data)ExcelClone.setData(m.data);
});

// Start the app when DOM is ready
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}

// === END OF APPLICATION ===
