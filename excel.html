<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Clone</title>
<style>
/* === MODULE: CSS / Theme === */
:root{
--green:#107C41;--green-d:#0b5a30;--green-l:#21a366;
--bg:#f3f3f3;--grid-bg:#fff;--grid-line:#d4d4d4;
--header-bg:#e8e8e8;--header-sel:#c5c5c5;
--sel:#1a73e8;--sel-fill:rgba(26,115,232,0.12);
--border-c:#888;--text:#222;--text-light:#666;
--toolbar-bg:#fafafa;--menu-bg:#fff;--shadow:0 2px 8px rgba(0,0,0,.18);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Calibri,Arial,sans-serif;font-size:13px}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);user-select:none}
button{cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}

/* Modo vista: solo la tabla, sin edición ni teclado */
body.vista #titlebar,body.vista #ribbon,body.vista #toolbar,body.vista #formulabar,body.vista #statusbar,body.vista #addsheet,body.vista #celleditor,body.vista #selectionoverlay{display:none!important}
#vistabtn{position:fixed;right:12px;bottom:40px;z-index:60;background:var(--green);color:#fff;border-radius:18px;padding:7px 14px;box-shadow:var(--shadow);font-weight:600}

/* Title bar */
#titlebar{height:32px;background:var(--green);color:#fff;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:600}
#titlebar .logo{font-weight:700;margin-right:auto}

/* Ribbon tabs */
#ribbon{height:28px;background:var(--green-d);display:flex;align-items:flex-end;padding-left:4px}
.rtab{padding:4px 14px;color:#dfe;font-size:12px;border-radius:4px 4px 0 0;cursor:pointer}
.rtab.active{background:var(--bg);color:var(--text);font-weight:600}
.rtab:hover:not(.active){background:rgba(255,255,255,.12)}

/* Toolbar */
#toolbar{height:84px;background:var(--toolbar-bg);border-bottom:1px solid #ccc;display:flex;align-items:center;padding:0 6px;gap:2px;overflow-x:auto;flex-wrap:nowrap}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px;border-radius:4px;gap:2px;min-width:42px;height:72px;flex-shrink:0}
.tbtn:hover{background:#e5e5e5}
.tbtn .ico{font-size:18px}
.tbtn .lbl{font-size:10px;text-align:center;line-height:1.1}
.tbtn.active{background:#cce0f5}
.tsep{width:1px;height:54px;background:#ccc;margin:0 2px;flex-shrink:0}
.tselect{height:28px;border:1px solid #ccc;border-radius:3px;background:#fff;padding:0 4px;font-size:12px;flex-shrink:0}

/* Formula bar */
#formulabar{display:flex;align-items:center;height:26px;border-bottom:1px solid #ccc;background:#fff;padding:0 4px;gap:4px}
#namebox{width:120px;height:22px;border:1px solid #ccc;text-align:center;font-size:12px;flex-shrink:0}
#fxlabel{font-style:italic;font-weight:600;color:#444;font-size:14px;flex-shrink:0}
#formulainput{flex:1;height:22px;border:1px solid #ccc;padding:0 4px;font-size:13px;outline:none}

/* Grid container */
#gridhost{flex:1;position:relative;overflow:hidden;background:var(--grid-bg);min-height:0}
#gridwrap{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;cursor:cell}
#gridspacer{position:relative;width:1px;height:1px}
#gridcanvas{position:absolute;top:0;left:0;pointer-events:none}
#celleditor{position:absolute;border:2px solid var(--sel);outline:none;padding:0;margin:0;background:#fff;z-index:10;display:none;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#selectionoverlay{position:absolute;top:0;left:0;pointer-events:none;z-index:5}

/* Status bar */
#statusbar{height:24px;background:var(--green);color:#fff;display:flex;align-items:center;padding:0 8px;font-size:11px;gap:16px;flex-shrink:0}
#statusbar .stat{white-space:nowrap}
#saveindicator{margin-left:auto;opacity:.85;font-size:11px}
#zoomctrl{display:flex;align-items:center;gap:2px}
#zoomctrl button{color:#fff;padding:0 4px;font-size:14px}
#zoomval{min-width:42px;text-align:center}

/* Sheet tabs */
#sheetbar{height:28px;background:#e8e8e8;border-top:1px solid #ccc;display:flex;align-items:center;padding:0 4px;gap:1px;flex-shrink:0;overflow-x:auto}
.shtab{padding:3px 12px;background:#f5f5f5;border:1px solid #ccc;border-bottom:none;border-radius:4px 4px 0 0;font-size:12px;cursor:pointer;white-space:nowrap;position:relative}
.shtab.active{background:#fff;font-weight:600;border-bottom:1px solid #fff}
.shtab:hover:not(.active){background:#fff}
#addsheet{font-size:16px;padding:3px 8px;color:var(--green)}

/* Context menu */
#ctxmenu{position:fixed;background:#fff;border:1px solid #bbb;box-shadow:var(--shadow);z-index:1000;display:none;min-width:200px;border-radius:2px}
.ctxitem{padding:6px 16px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;gap:20px}
.ctxitem:hover{background:var(--sel);color:#fff}
.ctxsep{height:1px;background:#eee;margin:2px 0}
.ctxkey{color:#999;font-size:11px}
.ctxitem:hover .ctxkey{color:#dfe}

/* Dialogs */
.dialog{position:fixed;background:#fff;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,.25);z-index:2000;display:none;min-width:340px;max-width:600px}
.dialog .dtitle{padding:10px 16px;background:var(--green);color:#fff;font-weight:600;border-radius:6px 6px 0 0;display:flex;justify-content:space-between}
.dialog .dbody{padding:16px}
.dialog .dfooter{padding:10px 16px;text-align:right;display:flex;justify-content:flex-end;gap:8px}
.dbtn{padding:6px 18px;border-radius:4px;font-size:13px;background:#e8e8e8;border:1px solid #ccc}
.dbtn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.dbtn:hover{background:#d5d5d5}
.dbtn.primary:hover{background:var(--green-d)}
.dclose{cursor:pointer;font-size:18px}
.drow{margin-bottom:10px}
.drow label{display:block;font-size:12px;margin-bottom:3px}
.drow select,.drow input{width:100%;height:28px;padding:0 6px;border:1px solid #ccc;border-radius:3px}

/* Tooltip */
#tooltip{position:fixed;background:#333;color:#fff;padding:4px 8px;border-radius:3px;font-size:11px;z-index:5000;display:none;pointer-events:none;max-width:260px;line-height:1.3}

/* Comment popup */
#commentpopup{position:fixed;background:#fffce8;border:1px solid #d4a017;border-radius:4px;padding:6px 10px;font-size:12px;z-index:5000;display:none;max-width:280px;box-shadow:0 2px 6px rgba(0,0,0,.15);color:#333}

/* Fill handle */
.fillhandle{position:absolute;width:7px;height:7px;background:var(--sel);border:1px solid #fff;z-index:6;cursor:crosshair}

/* Color picker */
#colorpicker{position:fixed;background:#fff;border:1px solid #ccc;box-shadow:var(--shadow);z-index:3000;display:none;padding:6px}
#colorpicker .cpswatch{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
#colorpicker .cpswatch div{width:16px;height:16px;cursor:pointer;border:1px solid #ddd}

/* Pivot UI */
#pivotui .pivotarea{border:1px dashed #aaa;min-height:60px;padding:6px;margin:4px 0;border-radius:4px}
#pivotui .pfield{display:inline-block;background:var(--sel);color:#fff;padding:3px 10px;margin:2px;border-radius:12px;font-size:11px;cursor:move}

/* Macro UI */
#macroui textarea{width:100%;height:200px;font-family:Consolas,monospace;font-size:12px;border:1px solid #ccc;padding:6px;border-radius:4px}

/* Layout */
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#ribboncontent{display:flex;flex-direction:column}
.hidden{display:none!important}

/* Fill handle visible on overlay */
.chartcontainer{position:absolute;border:1px solid #aaa;background:#fff;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.chartcontainer .charttitlebar{height:20px;background:var(--green);color:#fff;display:flex;align-items:center;padding:0 6px;font-size:11px;cursor:move}
.chartcontainer .chartclose{cursor:pointer;margin-left:auto}

/* Macro button overlay */
.macrobtn{position:absolute;z-index:25;padding:4px 16px;background:var(--green);color:#fff;border-radius:4px;font-size:12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#app{height:100dvh}
@media (max-width:700px){
#titlebar{display:none}
#toolbar{height:58px}
.tbtn{height:50px;min-width:44px;padding:2px 6px}
.tbtn .ico{font-size:17px}
.tsep{height:36px}
#namebox{width:62px}
#formulabar{height:32px}
#formulainput,#namebox{height:26px;font-size:14px}
#statusbar{height:26px;overflow-x:auto;white-space:nowrap}
.dialog{max-width:94vw;max-height:88vh;overflow:auto}
}
</style>
</head>
<body>
<div id="app">
<div id="titlebar"><span class="logo">Excel Clone</span><span style="font-size:11px;font-weight:400">- Edición en un solo archivo</span></div>
<div id="ribbon"></div>
<div id="toolbar"></div>
<div id="formulabar">
<input id="namebox" value="A1">
<span id="fxlabel">fx</span>
<input id="formulainput" placeholder="Escribe una fórmula o valor...">
</div>
<div id="gridhost">
<canvas id="gridcanvas"></canvas>
<div id="gridwrap"><div id="gridspacer"></div></div>
<div id="selectionoverlay"></div>
<input id="celleditor" type="text" autocomplete="off" autocapitalize="off">
</div>
<div id="statusbar">
<span id="selstats" class="stat">Listo</span>
<span id="saveindicator" class="stat">Guardado</span>
<span id="zoomctrl"><button id="zoomout">−</button><span id="zoomval">100%</span><button id="zoomin">+</button></span>
</div>
<div id="sheetbar"><button id="addsheet">+</button></div>
</div>
<div id="ctxmenu"></div>
<div id="tooltip"></div>
<div id="commentpopup"></div>
<div id="colorpicker"></div>
<div id="dialogs"></div>
<button id="vistabtn"></button>
<script>
"use strict";
/* ================================================================
   EXCEL CLONE — Single File
   Modules: Data Model, Storage, Grid Renderer, Formula Engine,
   Selection/Editing, Formatting, Sheets, Data Features, Charts,
   Pivot Tables, Macros, Import/Export, UI/Toolbar, Context Menus
   ================================================================ */

// === MODULE: Utility Helpers ===
const U = {
  clamp(v,a,b){return Math.max(a,Math.min(b,v));},
  colToLetter(c){let s='';c++;while(c>0){let m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26);}return s;},
  letterToCol(s){let c=0;for(let i=0;i<s.length;i++)c=c*26+(s.charCodeAt(i)-64);return c-1;},
  parseAddr(addr){const m=addr.match(/^([A-Z]+)(\d+)$/);if(!m)return null;return{col:U.letterToCol(m[1]),row:parseInt(m[2])-1};},
  addr(r,c){return U.colToLetter(c)+(r+1);},
  uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);},
  debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};},
  deepClone(o){return JSON.parse(JSON.stringify(o));},
};

// === Opciones para incrustar (por URL): ?modo=tabla | ?lectura=1 | ?barra=0 | ?formulas=0 | ?hojas=0 | ?estado=0 | ?libro=nombre ===
const EMBED=(()=>{
  const q=new URLSearchParams(location.search),modo=q.get('modo');
  const flag=(k,def)=>q.has(k)?q.get(k)!=='0':def;
  const tabla=modo==='tabla';
  const o={
    readonly:flag('lectura',tabla||modo==='lectura'),
    chrome:flag('barra',!tabla),
    formulas:flag('formulas',!tabla),
    hojas:flag('hojas',!tabla),
    estado:flag('estado',!tabla),
    suffix:q.get('libro')?':'+q.get('libro').replace(/[^\w.-]/g,'_'):'',
    vista:flag('vista',false),
    guardar:flag('guardar',true), // ?guardar=0 → no usa localStorage (ventanas generadas por Daily Dispatch)
  };
  o.apply=function(){
    const hide=(id)=>{const e=document.getElementById(id);if(e)e.style.display='none';};
    if(!o.chrome)['titlebar','ribbon','toolbar'].forEach(hide);
    if(!o.formulas)hide('formulabar');
    if(!o.hojas)hide('sheetbar');
    if(!o.estado)hide('statusbar');
    if(!o.guardar)hide('saveindicator');
    if(o.readonly)document.getElementById('formulainput').readOnly=true;
    Grid.resize();Grid.needsRender=true;
  };
  return o;
})();

// === MODULE: Data Model ===
const State = {
  workbook: null,
  activeSheet: 0,
  selection: {start:{r:0,c:0},end:{r:0,c:0},activeCell:{r:0,c:0}},
  scroll: {x:0,y:0},
  zoom: 1,
  editing: false,
  editingCell: null,
  clipboard: null,
  isCutting: false,
  history: [],
  historyIdx: -1,
  maxHistory: 50,
  dirty: false,
  contextMenuOpen: false,
  fillHandleActive: false,
  formatPainter: null,
  recordingMacro: null,
  charts: [],
  pivotTables: [],
  macroButtons: [],
  freeze: {rows:0,cols:0},
  filters: {},
  commentPopupCell: null,
  activeColorTarget: null,
  showCopyBorder: false,
};

const MAX_ROWS = 5000;
const MAX_COLS = 52;
const DEFAULT_COL_W = 80;
const DEFAULT_ROW_H = 22;

function createSheet(name){
  return {
    id: U.uid(),
    name: name,
    cells: {},          // key "r,c" => {v: raw value, f: formula string, fmt: {}, c: comment}
    colWidths: {},
    rowHeights: {},
    merges: {},          // "r,c" => {r,c,rs,cs} (top-left store)
    freeze: {rows:0,cols:0},
    filters: [],
    rowHidden: {},
    colHidden: {},
    charts: [],
    pivotTables: [],
    macroButtons: [],
    validations: {},
    autoFilter: null,
    formulaCells: new Set()
  };
}

function createWorkbook(){
  return {
    id: U.uid(),
    name: 'Book1',
    sheets: [createSheet('Hoja1')],
    active: 0,
    savedAt: 0,
  };
}

function getSheet(idx){return State.workbook.sheets[idx ?? State.activeSheet];}
function getActiveSheet(){return getSheet(State.activeSheet);}
function cellKey(r,c){return r+','+c;}
function getCell(sheet,r,c){return sheet.cells[cellKey(r,c)]||null;}
function getOrCreateCell(sheet,r,c){
  const k=cellKey(r,c);if(!sheet.cells[k])sheet.cells[k]={v:'',fmt:{}};return sheet.cells[k];
}
function setCellValue(sheet,r,c,val,formula){
  const cell=getOrCreateCell(sheet,r,c);
  cell.v=val;if(formula!==undefined)cell.f=formula;
}

// === MODULE: Storage Manager ===
const Storage = {
  STORAGE_KEY:'excel_clone_workbooks'+EMBED.suffix,
  ACTIVE_KEY:'excel_clone_active'+EMBED.suffix,
  saveDebounced: null,

  init(){
    this.saveDebounced = U.debounce(()=>this.save(),800);
    setInterval(()=>{if(State.dirty)this.save();},30000);
  },

  listWorkbooks(){
    try{return JSON.parse(localStorage.getItem(this.STORAGE_KEY)||'[]');}catch(e){return [];}
  },

  save(){
    if(!State.workbook)return;
    if(!EMBED.guardar){State.dirty=false;return;}
    try{
      const all=this.listWorkbooks();
      const wb=U.deepClone(State.workbook);
      wb.savedAt=Date.now();
      const idx=all.findIndex(w=>w.id===wb.id);
      if(idx>=0)all[idx]=wb;else all.push(wb);
      localStorage.setItem(this.STORAGE_KEY,JSON.stringify(all));
      localStorage.setItem(this.ACTIVE_KEY,wb.id);
      State.dirty=false;
      UI.setSaveIndicator(true);
      // Warn near 5MB
      const size=JSON.stringify(all).length;
      if(size>4.5e6){UI.warn('El almacenamiento está casi lleno (5 MB). Considera exportar tu trabajo.');}
    }catch(e){
      console.error('Save failed',e);
      UI.warn('No se pudo guardar — el almacenamiento puede estar lleno. Exporta tu trabajo para no perder datos.');
    }
  },

    load(id){
    const all=this.listWorkbooks();
    const wb=all.find(w=>w.id===id);
    if(wb){
      State.workbook=wb;
      State.activeSheet=wb.active||0;
      
      // --- NUEVO: Reparar libros antiguos ---
      for(const sheet of State.workbook.sheets) {
        if(!sheet.formulaCells) {
          sheet.formulaCells = new Set();
          // Re-escanear fórmulas existentes
          for(const k in sheet.cells) {
            if(sheet.cells[k].f) sheet.formulaCells.add(k);
          }
        }
      }
      // -------------------------------------
      
      return true;
    }
    return false;
  },

  loadLastActive(){
    const id=localStorage.getItem(this.ACTIVE_KEY);
    if(EMBED.guardar&&id&&this.load(id))return true;
    State.workbook=createWorkbook();
    return false;
  },

  delete(id){
    let all=this.listWorkbooks();
    all=all.filter(w=>w.id!==id);
    localStorage.setItem(this.STORAGE_KEY,JSON.stringify(all));
  },

  rename(id,name){
    let all=this.listWorkbooks();
    const wb=all.find(w=>w.id===id);
    if(wb){wb.name=name;localStorage.setItem(this.STORAGE_KEY,JSON.stringify(all));}
  },

  clearAll(){
    localStorage.removeItem(this.STORAGE_KEY);
    localStorage.removeItem(this.ACTIVE_KEY);
  },
};

// === MODULE: Grid Renderer ===
const Grid = {
  canvas:null,ctx:null,dpr:1,
  headerH:24,cornerW:40,
  colW:[],rowH:[],
  visibleRows:[],visibleCols:[],
  needsRender:true,

  init(){
    this.canvas=document.getElementById('gridcanvas');
    this.ctx=this.canvas.getContext('2d');
    this.resize();
    const wrap=document.getElementById('gridwrap');
    wrap.addEventListener('scroll',()=>{this.needsRender=true;});
    // Use a div with overflow for scrolling
    this.setupScroll();
    if(window.ResizeObserver)new ResizeObserver(()=>this.resize()).observe(document.getElementById('gridhost'));
  },

  setupScroll(){
    const wrap=document.getElementById('gridwrap');
    wrap.style.overflow='auto';
  },

  resize(){
    const wrap=document.getElementById('gridwrap');
    const w=wrap.clientWidth,h=wrap.clientHeight;
    this.dpr=window.devicePixelRatio||1;
    this.canvas.width=w*this.dpr;this.canvas.height=h*this.dpr;
    this.canvas.style.width=w+'px';this.canvas.style.height=h+'px';
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    this.needsRender=true;
  },

  colWidth(c){
    const s=getActiveSheet();
    return s.colHidden[c]?0:(s.colWidths[c]||DEFAULT_COL_W);
  },
  rowHeight(r){
    const s=getActiveSheet();
    return s.rowHidden[r]?0:(s.rowHeights[r]||DEFAULT_ROW_H);
  },

  // Calculate cumulative positions
  colX(c){
    let x=this.cornerW;
    for(let i=0;i<c;i++)x+=this.colWidth(i);
    return x;
  },
  rowY(r){
    let y=this.headerH;
    for(let i=0;i<r;i++)y+=this.rowHeight(i);
    return y;
  },

  // Find visible range given scroll (unscaled units)
  computeVisible(){
    const wrap=document.getElementById('gridwrap'),z=State.zoom;
    const sx=wrap.scrollLeft/z,sy=wrap.scrollTop/z,vw=wrap.clientWidth/z,vh=wrap.clientHeight/z;
    let startC=0,x=this.cornerW;
    while(startC<MAX_COLS-1&&x+this.colWidth(startC)<=sx+this.cornerW){x+=this.colWidth(startC);startC++;}
    let endC=startC,cx=x;
    while(endC<MAX_COLS-1&&cx<sx+vw){cx+=this.colWidth(endC);endC++;}
    let startR=0,y=this.headerH;
    while(startR<MAX_ROWS-1&&y+this.rowHeight(startR)<=sy+this.headerH){y+=this.rowHeight(startR);startR++;}
    let endR=startR,cy=y;
    while(endR<MAX_ROWS-1&&cy<sy+vh){cy+=this.rowHeight(endR);endR++;}
    this.visibleCols=[startC,endC];this.visibleRows=[startR,endR];
  },

  render(){
    if(!this.needsRender)return;
    this.needsRender=false;
    const ctx=this.ctx,wrap=document.getElementById('gridwrap'),z=State.zoom;
    const sx=wrap.scrollLeft/z,sy=wrap.scrollTop/z,vw=wrap.clientWidth/z,vh=wrap.clientHeight/z;
    const sp=document.getElementById('gridspacer');
    sp.style.width=(this.colX(MAX_COLS)*z)+'px';sp.style.height=(this.rowY(MAX_ROWS)*z)+'px';
    Charts.updateLive();
    ctx.save();
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.clearRect(0,0,wrap.clientWidth,wrap.clientHeight);
    ctx.scale(z,z);
    this.computeVisible();
    const [sc,ec]=this.visibleCols,[sr,er]=this.visibleRows;
    const sheet=getActiveSheet();
    ctx.save();
    ctx.beginPath();ctx.rect(this.cornerW,this.headerH,vw,vh);ctx.clip();
    ctx.translate(-sx,-sy);
    for(let r=sr;r<=er;r++){
      if(sheet.rowHidden[r])continue;
      const rh=this.rowHeight(r),y=this.rowY(r);
      for(let c=sc;c<=ec;c++){
        if(sheet.colHidden[c])continue;
        this.drawCell(sheet,r,c,this.colX(c),y,this.colWidth(c),rh);
      }
    }
        // Gridlines respetando merges (no dibujar segmentos internos a un merge)
    ctx.strokeStyle='#e0e0e0';ctx.lineWidth=1/z;ctx.beginPath();
    const x0=this.colX(sc),x1=this.colX(ec+1),y0=this.rowY(sr),y1=this.rowY(er+1);
    for(let c=sc;c<=ec+1;c++){
      const x=this.colX(c);
      for(let r=sr;r<=er;r++){
        if(sheet.rowHidden[r])continue;
        if(c>sc){
          const mL=this.getMergeAt(sheet,r,c-1),mR=this.getMergeAt(sheet,r,c);
          if(mL&&mR&&mL===mR)continue;
        }
        ctx.moveTo(x,this.rowY(r));ctx.lineTo(x,this.rowY(r+1));
      }
    }
    for(let r=sr;r<=er+1;r++){
      const y=this.rowY(r);
      for(let c=sc;c<=ec;c++){
        if(sheet.colHidden[c])continue;
        if(r>sr){
          const mT=this.getMergeAt(sheet,r-1,c),mB=this.getMergeAt(sheet,r,c);
          if(mT&&mB&&mT===mB)continue;
        }
        ctx.moveTo(this.colX(c),y);ctx.lineTo(this.colX(c+1),y);
      }
    }
    ctx.stroke();
    this.drawBorders(sheet,sc,ec,sr,er);   // ← bordes personalizados encima de gridlines
    this.drawMerges(sheet,sc,ec,sr,er);
    this.drawSelection(sx,sy);
    this.drawCopyBorder(sx, sy);
    const fz=sheet.freeze;
    if(fz){
      ctx.strokeStyle='#107C41';ctx.lineWidth=2/z;ctx.beginPath();
      if(fz.cols>0){const x=this.colX(fz.cols);ctx.moveTo(x,y0);ctx.lineTo(x,y1);}
      if(fz.rows>0){const y=this.rowY(fz.rows);ctx.moveTo(x0,y);ctx.lineTo(x1,y);}
      ctx.stroke();
    }
    ctx.restore();
    this.drawHeaders(sc,ec,sr,er,sx,sy,vw,vh);
    ctx.restore();
    this.updateOverlay();
  },

  drawCell(sheet,r,c,x,y,w,h){
    const ctx=this.ctx;
    const cell=getCell(sheet,r,c);
    const fmt=(cell&&cell.fmt)||{};
    // Check if this is part of a merged region (non-origin)
    const merge=this.getMergeAt(sheet,r,c);
    if(merge&&(merge.r!==r||merge.c!==c))return; // skip non-origin
    if(merge){w=0;for(let i=0;i<merge.cs;i++)w+=this.colWidth(c+i);h=0;for(let i=0;i<merge.rs;i++)h+=this.rowHeight(r+i);}

    // Background
    if(fmt.bg){ctx.fillStyle=fmt.bg;ctx.fillRect(x,y,w,h);}

    // Text
    let text=this.getDisplayValue(sheet,r,c,cell);
    if(!text)return;
    ctx.save();
    // Font
    const fontSize=(fmt.size||11);
    ctx.font=`${fmt.bold?'bold ':''}${fmt.italic?'italic ':''}${fontSize}px ${fmt.font||'Segoe UI'}, sans-serif`;
    ctx.textBaseline='middle';
    // Alignment
    let align=fmt.align||(typeof cell?.v==='number'?'right':'left');
    ctx.textAlign=align;
    let tx=x+3;
    if(align==='center')tx=x+w/2;
    else if(align==='right')tx=x+w-3;
    let ty=y+h/2;
    if(fmt.valign==='top')ty=y+fontSize/2+2;
    else if(fmt.valign==='bottom')ty=y+h-fontSize/2-2;
    ctx.fillStyle=fmt.color||'#222';
    // Clip
    ctx.beginPath();ctx.rect(x+1,y+1,w-2,h-2);ctx.clip();
    ctx.fillText(text,tx,ty);
    // Strikethrough / underline
    if(fmt.strike){const tw=ctx.measureText(text).width;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+tw,ty);ctx.stroke();}
    if(fmt.underline){const tw=ctx.measureText(text).width;const uy=ty+fontSize/2;ctx.beginPath();ctx.moveTo(tx,uy);ctx.lineTo(tx+tw,uy);ctx.stroke();}
    ctx.restore();

    

    // Comment indicator
    if(cell&&cell.comment){
      ctx.fillStyle='#d4a017';
      ctx.beginPath();ctx.moveTo(x+w-6,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+6);ctx.closePath();ctx.fill();
    }
const valid = Validation.getValidation(sheet, r, c);
    if (valid && valid.type === 'list') {
      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.moveTo(x + w - 10, y + h - 8);
      ctx.lineTo(x + w - 4, y + h - 8);
      ctx.lineTo(x + w - 7, y + h - 2);
      ctx.closePath();
      ctx.fill();
    }
  },

  getDisplayValue(sheet,r,c,cell){
    if(!cell)return '';
    // Check error
    if(cell.error)return cell.error;
    if(cell.f){return cell.v===undefined||cell.v===''?'':String(cell.v);}
    const fmt=cell.fmt||{};
    let v=cell.v;
    if(v===undefined||v==='')return '';
    if(fmt.format&&fmt.format!=='General'&&typeof v==='number'){
      return Format.applyFormat(v,fmt.format);
    }
    return String(v);
  },

  drawHeaders(sc,ec,sr,er,sx,sy,vw,vh){
    const ctx=this.ctx,z=State.zoom,sheet=getActiveSheet(),sel=State.selection;
    const c0=Math.min(sel.start.c,sel.end.c),c1=Math.max(sel.start.c,sel.end.c);
    const r0=Math.min(sel.start.r,sel.end.r),r1=Math.max(sel.start.r,sel.end.r);
    ctx.font='11px Segoe UI, sans-serif';ctx.textBaseline='middle';ctx.textAlign='center';ctx.lineWidth=1/z;
    ctx.save();ctx.beginPath();ctx.rect(this.cornerW,0,vw,this.headerH);ctx.clip();
    ctx.fillStyle='#f0f0f0';ctx.fillRect(this.cornerW,0,vw,this.headerH);
    for(let c=sc;c<=ec;c++){
      if(sheet.colHidden[c])continue;
      const x=this.colX(c)-sx,w=this.colWidth(c);
      
      // NUEVO: Priorizar el color de la columna activa
      if(c === sel.activeCell.c) {
        ctx.fillStyle='#a9d08e'; // Verde más oscuro para la columna actual
      } else if(c>=c0&&c<=c1) {
        ctx.fillStyle='#c5e0b4';
      } else {
        ctx.fillStyle='#f0f0f0';
      }
      
      ctx.fillRect(x,0,w,this.headerH);
      ctx.strokeStyle='#ccc';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,this.headerH);ctx.stroke();
      ctx.fillStyle='#333';ctx.fillText(U.colToLetter(c)+(getActiveSheet().autoFilter?.filters[c]?' 🔽':''),x+w/2,this.headerH/2);
    }
    ctx.restore();
    ctx.save();ctx.beginPath();ctx.rect(0,this.headerH,this.cornerW,vh);ctx.clip();
    ctx.fillStyle='#f0f0f0';ctx.fillRect(0,this.headerH,this.cornerW,vh);
    for(let r=sr;r<=er;r++){
      if(sheet.rowHidden[r])continue;
      const y=this.rowY(r)-sy,h=this.rowHeight(r);
      
      // NUEVO: Priorizar el color de la fila activa
      if(r === sel.activeCell.r) {
        ctx.fillStyle='#a9d08e';
      } else if(r>=r0&&r<=r1) {
        ctx.fillStyle='#c5e0b4';
      } else {
        ctx.fillStyle='#f0f0f0';
      }
      
      ctx.fillRect(0,y,this.cornerW,h);
      ctx.strokeStyle='#ccc';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(this.cornerW,y);ctx.stroke();
      ctx.fillStyle='#333';ctx.fillText(r+1,this.cornerW/2,y+h/2);
    }
    ctx.restore();
    ctx.fillStyle='#e0e0e0';ctx.fillRect(0,0,this.cornerW,this.headerH);
    ctx.strokeStyle='#ccc';ctx.strokeRect(0,0,this.cornerW,this.headerH);
  },

    drawSelection(sx,sy){
    const ctx=this.ctx;
    const sel=State.selection;
    const sheet=getActiveSheet();
    
    let r0=Math.min(sel.start.r,sel.end.r),r1=Math.max(sel.start.r,sel.end.r);
    let c0=Math.min(sel.start.c,sel.end.c),c1=Math.max(sel.start.c,sel.end.c);
    
    // NUEVO: Expandir los límites de la selección si tocan una celda combinada
    const mStart = this.getMergeAt(sheet, r0, c0);
    if (mStart) { r0 = mStart.r; c0 = mStart.c; }
    const mEnd = this.getMergeAt(sheet, r1, c1);
    if (mEnd) { r1 = mEnd.r + mEnd.rs - 1; c1 = mEnd.c + mEnd.cs - 1; }

    let x=this.colX(c0),y=this.rowY(r0);
    let w=this.colX(c1)+this.colWidth(c1)-x;
    let h=this.rowY(r1)+this.rowHeight(r1)-y;
    
    ctx.strokeStyle='#1a73e8';
    ctx.lineWidth=1.5/State.zoom;
    // Fill
    ctx.fillStyle='rgba(26,115,232,0.08)';
    ctx.fillRect(x,y,w,h);
    ctx.strokeRect(x,y,w,h);
    
    // Active cell border
    const ar=sel.activeCell.r,ac=sel.activeCell.c;
    const am=this.getMergeAt(sheet,ar,ac);
    
    // NUEVO: Usar las coordenadas del origen de la combinación (am.c y am.r)
    if(am){
      let ax=this.colX(am.c),ay=this.rowY(am.r);
      let aw=0,ah=0;
      for(let i=0;i<am.cs;i++)aw+=this.colWidth(am.c+i);
      for(let i=0;i<am.rs;i++)ah+=this.rowHeight(am.r+i);
      ctx.strokeRect(ax,ay,aw,ah);
    }else{
      let ax=this.colX(ac),ay=this.rowY(ar);
      let aw=this.colWidth(ac),ah=this.rowHeight(ar);
      ctx.strokeRect(ax,ay,aw,ah);
    }
  },




      drawCopyBorder(sx, sy) {
    if (!State.clipboard || !State.showCopyBorder) return;
    if (State.clipboard.sheetIdx !== State.activeSheet) return;

    const { r0, c0, r1, c1 } = State.clipboard;
    const ctx = this.ctx;
    
    const x = this.colX(c0);
    const y = this.rowY(r0);
    let w = this.colX(c1) + this.colWidth(c1) - x;
    let h = this.rowY(r1) + this.rowHeight(r1) - y;
    
    ctx.save();
    ctx.strokeStyle = '#107C41'; // Verde Excel
    ctx.lineWidth = 1.5 / State.zoom;
    ctx.setLineDash([5 / State.zoom, 5 / State.zoom]); // El "punteado"
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
  },




  drawMerges(sheet,sc,ec,sr,er){
    // Merges are drawn in drawCell already (origin cell spans full area)
    // Draw border for merged cells
    const ctx=this.ctx;
    for(const k in sheet.merges){
      const m=sheet.merges[k];
      if(m.r<sr||m.r>er||m.c<sc||m.c>ec)continue;
      const x=this.colX(m.c),y=this.rowY(m.r);
      let w=0;for(let i=0;i<m.cs;i++)w+=this.colWidth(m.c+i);
      let h=0;for(let i=0;i<m.rs;i++)h+=this.rowHeight(m.r+i);
      ctx.strokeStyle='#d0d0d0';ctx.lineWidth=1/State.zoom;
      ctx.strokeRect(x,y,w,h);
    }
  },


       drawBorders(sheet,sc,ec,sr,er){
    const ctx=this.ctx;
    for(let r=sr;r<=er;r++){
      if(sheet.rowHidden[r])continue;
      const rh=this.rowHeight(r),y=this.rowY(r);
      for(let c=sc;c<=ec;c++){
        if(sheet.colHidden[c])continue;
        const cell=getCell(sheet,r,c);
        if(!cell||!cell.fmt||!cell.fmt.borders)continue;
        const bs=cell.fmt.borders;
        const merge=this.getMergeAt(sheet,r,c);
        if(merge&&(merge.r!==r||merge.c!==c))continue;
        let x=this.colX(c),w=this.colWidth(c),h=rh;
        if(merge){w=0;for(let i=0;i<merge.cs;i++)w+=this.colWidth(c+i);
                  h=0;for(let i=0;i<merge.rs;i++)h+=this.rowHeight(r+i);}
        ctx.strokeStyle=bs.borderColor||'#000'; 

        if(bs.top){ctx.lineWidth=(bs.topWidth||1)/State.zoom;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();}
        if(bs.bottom){ctx.lineWidth=(bs.bottomWidth||1)/State.zoom;ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.stroke();}
        if(bs.left){ctx.lineWidth=(bs.leftWidth||1)/State.zoom;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h);ctx.stroke();}
        if(bs.right){ctx.lineWidth=(bs.rightWidth||1)/State.zoom;ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.stroke();}
      }
    }
  },



  autoFitColumn(c) {
    const sheet = getActiveSheet();
    const ctx = this.ctx;
    let maxW = 50; // Ancho mínimo por defecto
    ctx.font = '11px Segoe UI, sans-serif'; // Fuente base para medir

    for (const k in sheet.cells) {
      const [kr, kc] = k.split(',').map(Number);
      if (kc === c) {
        const cell = sheet.cells[k];
        let text = cell.f ? (cell.error || String(cell.v ?? '')) : String(cell.v ?? '');
        if (cell.fmt && cell.fmt.size) ctx.font = `11px Segoe UI, sans-serif`; // Podrías ajustar según el size real
        const textW = ctx.measureText(text).width;
        // Sumamos padding (aprox 16px) para que el texto respire
        if (textW + 16 > maxW) maxW = textW + 16;
      }
    }
    sheet.colWidths[c] = Math.min(maxW, 400); // Tope máximo de 400px
    Grid.needsRender = true;
    Storage.saveDebounced();
  },




  getMergeAt(sheet,r,c){
    // Check if cell is within a merged region
    for(const k in sheet.merges){
      const m=sheet.merges[k];
      if(r>=m.r&&r<m.r+m.rs&&c>=m.c&&c<m.c+m.cs)return m;
    }
    return null;
  },

    updateOverlay(){
    const overlay=document.getElementById('selectionoverlay');
    const sel=State.selection;
    const sheet=getActiveSheet();
    
    let r0=Math.min(sel.start.r,sel.end.r),r1=Math.max(sel.start.r,sel.end.r);
    let c0=Math.min(sel.start.c,sel.end.c),c1=Math.max(sel.start.c,sel.end.c);
    
    // NUEVO: Expandir los límites si hay combinación
    const mStart = this.getMergeAt(sheet, r0, c0);
    if (mStart) { r0 = mStart.r; c0 = mStart.c; }
    const mEnd = this.getMergeAt(sheet, r1, c1);
    if (mEnd) { r1 = mEnd.r + mEnd.rs - 1; c1 = mEnd.c + mEnd.cs - 1; }

    let x=this.colX(c0),y=this.rowY(r0);
    let w=this.colX(c1)+this.colWidth(c1)-x;
    let h=this.rowY(r1)+this.rowHeight(r1)-y;
    const wrap=document.getElementById('gridwrap');
    const sx=wrap.scrollLeft,sy=wrap.scrollTop;
    
    // Fill handle
    let fh=overlay.querySelector('.fillhandle');
    if(!fh){fh=document.createElement('div');fh.className='fillhandle';overlay.appendChild(fh);}
    const z=State.zoom;
    fh.style.left=((x+w-4)*z-sx)+'px';
    fh.style.top=((y+h-4)*z-sy)+'px';
    fh.style.display=(r0===r1&&c0===c1)||State.editing?'none':'block';

    // Editor position
    if(State.editing){
      const ed=document.getElementById('celleditor');
      const ar=sel.activeCell.r,ac=sel.activeCell.c;
      const am=this.getMergeAt(sheet,ar,ac);
      
      // NUEVO: Si está combinada, el editor usa las coordenadas del ORIGEN
      if(am){
        let ax=this.colX(am.c),ay=this.rowY(am.r);
        let aw=0,ah=0;
        for(let i=0;i<am.cs;i++)aw+=this.colWidth(am.c+i);
        for(let i=0;i<am.rs;i++)ah+=this.rowHeight(am.r+i);
        ed.style.display='block';
        ed.style.left=(ax*z-sx)+'px';
        ed.style.top=(ay*z-sy)+'px';
        ed.style.width=(aw*z)+'px';
        ed.style.height=(ah*z)+'px';
      } else {
        let ax=this.colX(ac),ay=this.rowY(ar);
        let aw=this.colWidth(ac),ah=this.rowHeight(ar);
        ed.style.display='block';
        ed.style.left=(ax*z-sx)+'px';
        ed.style.top=(ay*z-sy)+'px';
        ed.style.width=(aw*z)+'px';
        ed.style.height=(ah*z)+'px';
      }
      const cell=getCell(sheet,ar,ac);
      ed.style.font=((cell&&cell.fmt&&cell.fmt.bold)?'bold ':'')+(((cell&&cell.fmt&&cell.fmt.size)||11)*z)+'px '+((cell&&cell.fmt&&cell.fmt.font)||'Segoe UI');
    }
  },

  // Hit test: screen coords -> {r,c,type}
  hitTest(mx,my){
    const wrap=document.getElementById('gridwrap'),z=State.zoom;
    const hx=mx/z,hy=my/z,rx=(mx+wrap.scrollLeft)/z,ry=(my+wrap.scrollTop)/z;
    if(hx<this.cornerW&&hy<this.headerH)return{type:'corner'};
    const findC=()=>{let c=0,cx=this.cornerW;while(c<MAX_COLS-1&&cx+this.colWidth(c)<=rx){cx+=this.colWidth(c);c++;}return c;};
    const findR=()=>{let r=0,y=this.headerH;while(r<MAX_ROWS-1&&y+this.rowHeight(r)<=ry){y+=this.rowHeight(r);r++;}return r;};
    if(hy<this.headerH)return{type:'colheader',col:findC()};
    if(hx<this.cornerW)return{type:'rowheader',row:findR()};
    return{type:'cell',row:findR(),col:findC()};
  },

  loop(){
    Grid.render();
    requestAnimationFrame(Grid.loop);
  },
};

// === MODULE: Formula Engine — Parser ===
const Formula = {
  // Token types: NUM, STR, REF, RANGE, FUNC, OP, LPAREN, RPAREN, COMMA, SHEETREF, BOOL, NAME
  // AST nodes: {type, ...}

  tokenize(formula){
    const tokens=[];
    let i=0;
    const f=formula.replace(/"[^"]*"|'[^']*'|[^"']+/g,x=>(x[0]==='"'||x[0]==="'")?x:x.toUpperCase());
    while(i<f.length){
      const ch=f[i];
      if(ch===' '||ch==='\t'||ch==='\n'||ch==='\r'){i++;continue;}
      if(ch==='"'){ // String literal
        let s='';i++;
        while(i<f.length&&f[i]!=='"'){s+=f[i];i++;}
        i++;tokens.push({t:'STR',v:s});continue;
      }
      if(ch>='0'&&ch<='9'||(ch==='.'&&f[i+1]>='0'&&f[i+1]<='9')){
        let s='';while(i<f.length&&((f[i]>='0'&&f[i]<='9')||f[i]==='.')){s+=f[i];i++;}
        if(f[i]==='E'||f[i]==='e'){s+=f[i];i++;if(f[i]==='+'||f[i]==='-'){s+=f[i];i++;}while(i<f.length&&(f[i]>='0'&&f[i]<='9')){s+=f[i];i++;}}
        tokens.push({t:'NUM',v:parseFloat(s)});continue;
      }
      // Sheet reference: Sheet1! or 'Sheet Name'!
      if((ch>='A'&&ch<='Z')||(ch>='a'&&ch<='z')||ch==='_'||ch==="'"){
        let sheetName=null;
        if(ch==="'"){
          let s='';i++;
          while(i<f.length&&f[i]!=="'"){s+=f[i];i++;}
          i++;sheetName=s;
          if(f[i]==='!'){i++;}
        } else {
          // Check for sheet! pattern
          let j=i;let name='';
          while(j<f.length&&((f[j]>='A'&&f[j]<='Z')||(f[j]>='a'&&f[j]<='z')||(f[j]>='0'&&f[j]<='9')||f[j]==='_')){name+=f[j];j++;}
          if(f[j]==='!'){sheetName=name;i=j+1;}
        }
        // Now parse cell ref or range or function or name
        if(sheetName!==null){
          // Parse cell ref after sheet
          const ref=this.readRef(f,i);
          if(ref){i=ref.end;
            if(f[i]===':'){const ref2=this.readRef(f,i+1);if(ref2){i=ref2.end;tokens.push({t:'RANGE',v:ref.ref+':'+ref2.ref,sheet:sheetName});continue;}}
            tokens.push({t:'REF',v:ref.ref,sheet:sheetName});continue;}
        }
        // Try cell ref
        const ref=this.readRef(f,i);
        if(ref){i=ref.end;
          // Check for range
          if(f[i]===':'&&f[i+1]!==undefined){
            const ref2=this.readRef(f,i+1);
            if(ref2){i=ref2.end;tokens.push({t:'RANGE',v:ref.ref+':'+ref2.ref,sheet:null});continue;}
          }
          tokens.push({t:'REF',v:ref.ref,sheet:null});continue;
        }
        // Named: could be function or boolean or name
        let name='';
        while(i<f.length&&((f[i]>='A'&&f[i]<='Z')||(f[i]>='a'&&f[i]<='z')||(f[i]>='0'&&f[i]<='9')||f[i]==='.'||f[i]==='_')){name+=f[i];i++;}
        name=name.toUpperCase();
        if(f[i]==='('){tokens.push({t:'FUNC',v:name});continue;}
        if(name==='TRUE'){tokens.push({t:'BOOL',v:true});continue;}
        if(name==='FALSE'){tokens.push({t:'BOOL',v:false});continue;}
        // Could be sheet!ref — already handled. Could be named range (not supported yet)
        // Could be a sheet ref without ! if followed by ! — handled above
        tokens.push({t:'NAME',v:name});continue;
      }
      // Operators
      if('<>=!'.includes(ch)){
        let op=ch;i++;
        if(f[i]==='='||(ch==='<'&&f[i]==='>')||(ch==='>'&&f[i]==='=')){op+=f[i];i++;}
        tokens.push({t:'OP',v:op});continue;
      }
      if('+-*/^&%'.includes(ch)){tokens.push({t:'OP',v:ch});i++;continue;}
      if(ch==='('){tokens.push({t:'LPAREN'});i++;continue;}
      if(ch===')'){tokens.push({t:'RPAREN'});i++;continue;}
      if(ch===','||ch===';'){tokens.push({t:'COMMA'});i++;continue;}
      if(ch==='$'){i++;continue;} // Handle in readRef
      i++; // skip unknown
    }
    return tokens;
  },

  readRef(f,start){
    let i=start;
    let colStr='';
    while(i<f.length&&f[i]==='$')i++;
    while(i<f.length&&f[i]>='A'&&f[i]<='Z'){colStr+=f[i];i++;}
    while(i<f.length&&f[i]==='$')i++;
    let rowStr='';
    while(i<f.length&&f[i]>='0'&&f[i]<='9'){rowStr+=f[i];i++;}
    if(!colStr||!rowStr)return null;
    return{ref:f.substring(start,i),end:i};
  },

  // Recursive descent parser
  parse(tokens){
    let pos=0;
    const peek=()=>tokens[pos];
    const next=()=>tokens[pos++];
    function parseExpr(){
      let left=parseCompare();
      return left;
    }
    function parseCompare(){
      let left=parseConcat();
      while(peek()&&peek().t==='OP'&&['<','>','=','<=','>=','<>'].includes(peek().v)){
        const op=next().v;
        const right=parseConcat();
        left={type:'binop',op,left,right};
      }
      return left;
    }
    function parseConcat(){
      let left=parseAdd();
      while(peek()&&peek().t==='OP'&&peek().v==='&'){
        next();
        const right=parseAdd();
        left={type:'binop',op:'&',left,right};
      }
      return left;
    }
    function parseAdd(){
      let left=parseMul();
      while(peek()&&peek().t==='OP'&&['+','-'].includes(peek().v)){
        const op=next().v;const right=parseMul();
        left={type:'binop',op,left,right};
      }
      return left;
    }
    function parseMul(){
      let left=parsePow();
      while(peek()&&peek().t==='OP'&&['*','/'].includes(peek().v)){
        const op=next().v;const right=parsePow();
        left={type:'binop',op,left,right};
      }
      return left;
    }
    function parsePow(){
      let left=parseUnary();
      while(peek()&&peek().t==='OP'&&peek().v==='^'){
        next();const right=parseUnary();
        left={type:'binop',op:'^',left,right};
      }
      return left;
    }
    function parseUnary(){
      if(peek()&&peek().t==='OP'&&(peek().v==='-'||peek().v==='+')){
        const op=next().v;
        const operand=parseUnary();
        return{type:'unary',op,operand};
      }
      let p=parsePrimary();
      while(peek()&&peek().t==='OP'&&peek().v==='%'){next();p={type:'binop',op:'%',left:p,right:{type:'num',v:0}};}
      return p;
    }
    function parsePrimary(){
      const tk=peek();
      if(!tk)return{type:'error',v:'#VALUE!'};
      if(tk.t==='NUM'){next();return{type:'num',v:tk.v};}
      if(tk.t==='STR'){next();return{type:'str',v:tk.v};}
      if(tk.t==='BOOL'){next();return{type:'bool',v:tk.v};}
      if(tk.t==='REF'){next();return{type:'ref',v:tk.v,sheet:tk.sheet};}
      if(tk.t==='RANGE'){next();return{type:'range',v:tk.v,sheet:tk.sheet};}
      if(tk.t==='NAME'){next();return{type:'name',v:tk.v};}
      if(tk.t==='FUNC'){
        const name=next().v;
        const args=[];
        if(peek()&&peek().t==='LPAREN'){next();}
        if(peek()&&peek().t!=='RPAREN'){
          args.push(parseExpr());
          while(peek()&&peek().t==='COMMA'){next();args.push(parseExpr());}

        if(peek()&&peek().t==='RPAREN')next();

      }
      if(tk.t==='LPAREN'){next();const e=parseExpr();if(peek()&&peek().t==='RPAREN')next();return e;}
      next();
      return{type:'error',v:'#VALUE!'};
    }
    return parseExpr();
  },

  // === Evaluator ===
  evalStack:[],
  depGraph:{}, // cell key -> Set of dependent cell keys (for recalc)
  cellDeps:{},  // cell key -> Set of cells it depends on

  evalCell(sheet,r,c){
    const cell=getCell(sheet,r,c);
    if(!cell||(!cell.f&&!cell.v))return;
    if(cell.f){
      this.evalStack.push({sheet:sheet.name,r,c});
      try{
        const result=this.evalFormula(cell.f,sheet);
        cell.v=result.value;
        cell.error=result.error||null;
      }catch(e){
        cell.v='';
        cell.error=String(e.message||e);
      }
      this.evalStack.pop();
    }
  },

  evalFormula(formula,sheet){
    const f=formula.startsWith('=')?formula.substring(1):formula;
    const tokens=this.tokenize(f);
    const ast=this.parse(tokens);
    const ctx={sheet,stack:[...this.evalStack]};
    return this.evalAST(ast,ctx);
  },

  evalAST(node,ctx){
    if(!node)return{value:'',error:null};
    switch(node.type){
      case'num':return{value:node.v,error:null};
      case'str':return{value:node.v,error:null};
      case'bool':return{value:node.v,error:null};
      case'error':return{value:'',error:node.v};
      case'name':return{value:'',error:'#NAME?'};
      case'ref':{
        const val=this.getRefValue(node.v,node.sheet||ctx.sheet.name,ctx);
        return val;
      }
      case'range':{
        // Range used as scalar — return first cell
        const parts=node.v.split(':');
        const s1=U.parseAddr(parts[0]),s2=U.parseAddr(parts[1]);
        const sheetName=node.sheet||ctx.sheet.name;
        const sh=this.findSheet(sheetName);
        if(!sh)return{value:'',error:'#REF!'};
        const r0=Math.min(s1.row,s2.row),c0=Math.min(s1.col,s2.col);
        const cell=getCell(sh,r0,c0);
        return{value:cell?cell.v:'',error:null};
      }
      case'unary':{
        const op=this.evalAST(node.operand,ctx);
        if(op.error)return op;
        if(node.op==='-')return{value:-this.toNum(op.value),error:null};
        return op;
      }
      case'binop':{
        const l=this.evalAST(node.left,ctx);
        const r=this.evalAST(node.right,ctx);
        if(l.error)return l;
        if(r.error)return r;
        return this.applyBinop(node.op,l.value,r.value);
      }
      case'func':{
        return this.evalFunc(node.name,node.args,ctx);
      }
    }
    return{value:'',error:'#VALUE!'};
  },

  applyBinop(op,l,r){
    if(op==='&')return{value:''+this.toStr(l)+this.toStr(r),error:null};
    if(op==='+')return{value:this.toNum(l)+this.toNum(r),error:null};
    if(op==='-')return{value:this.toNum(l)-this.toNum(r),error:null};
    if(op==='*')return{value:this.toNum(l)*this.toNum(r),error:null};
    if(op==='/'){const d=this.toNum(r);if(d===0)return{value:'',error:'#DIV/0!'};return{value:this.toNum(l)/d,error:null};}
    if(op==='^')return{value:Math.pow(this.toNum(l),this.toNum(r)),error:null};
    if(op==='%')return{value:this.toNum(l)/100,error:null};
    if(op==='=')return{value:this.compareEq(l,r),error:null};
    if(op==='<>')return{value:!this.compareEq(l,r),error:null};
    if(op==='<')return{value:this.compare(l,r)<0,error:null};
    if(op==='>')return{value:this.compare(l,r)>0,error:null};
    if(op==='<=')return{value:this.compare(l,r)<=0,error:null};
    if(op==='>=')return{value:this.compare(l,r)>=0,error:null};
    return{value:'',error:'#VALUE!'};
  },

  compareEq(l,r){
    if(typeof l==='number'&&typeof r==='number')return l===r;
    return String(l)===String(r);
  },
  compare(l,r){
    if(typeof l==='number'&&typeof r==='number')return l-r;
    return String(l).localeCompare(String(r));
  },

  toNum(v){if(typeof v==='number')return v;if(typeof v==='boolean')return v?1:0;const n=parseFloat(v);return isNaN(n)?0:n;},
  toStr(v){if(v===null||v===undefined)return'';return String(v);},

  getRefValue(ref,sheetName,ctx){
    // Parse ref like $A$1, A1
    const addr=U.parseAddr(ref.replace(/\$/g,''));
    if(!addr)return{value:'',error:'#REF!'};
    const sh=this.findSheet(sheetName);
    if(!sh)return{value:'',error:'#REF!'};
    // Circular check
    const key=sh.name+'!'+addr.row+','+addr.col;
    if(ctx.stack.some(s=>s.sheet===sh.name&&s.r===addr.row&&s.c===addr.col))
      return{value:'',error:'#CIRCULAR!'};
    const cell=getCell(sh,addr.row,addr.col);
    if(cell&&cell.f){
      // Recursively evaluate
      this.evalCell(sh,addr.row,addr.col);
      return{value:cell.v,error:cell.error||null};
    }
    return{value:cell?cell.v:'',error:null};
  },

  findSheet(name){
    const n=String(name).toLowerCase();return State.workbook.sheets.find(s=>s.name.toLowerCase()===n);
  },

  // Range to 2D array of values
  getRangeValues(rangeStr,sheetName,ctx){
    const parts=rangeStr.split(':');
    const s1=U.parseAddr(parts[0].replace(/\$/g,''));
    const s2=U.parseAddr(parts[1].replace(/\$/g,''));
    if(!s1||!s2)return[];
    const sh=this.findSheet(sheetName);
    if(!sh)return[];
    const r0=Math.min(s1.row,s2.row),r1=Math.max(s1.row,s2.col===undefined?s2.row:s2.row);
    const c0=Math.min(s1.col,s2.col),c1=Math.max(s1.col,s2.col);
    const arr=[];
    for(let r=r0;r<=r1;r++){
      const row=[];
      for(let c=c0;c<=c1;c++){
        const cell=getCell(sh,r,c);
        if(cell&&cell.f)this.evalCell(sh,r,c);
        row.push(cell?cell.v:'');
      }
      arr.push(row);
    }
    return arr;
  },

  // Parse range string to bounds
  parseRange(rangeStr){
    const parts=rangeStr.split(':');
    const s1=U.parseAddr(parts[0].replace(/\$/g,''));
    const s2=U.parseAddr(parts[1].replace(/\$/g,''));
    if(!s1||!s2)return null;
    return{r0:Math.min(s1.row,s2.row),r1:Math.max(s1.row,s2.row),c0:Math.min(s1.col,s2.col),c1:Math.max(s1.col,s2.col)};
  },
};

// === MODULE: Formula Engine — Built-in Functions ===
Formula.evalFunc=function(name,args,ctx){
  const F=this;
  const ev=(a)=>F.evalAST(a,ctx);
  const evNum=(a)=>{const r=ev(a);return F.toNum(r.value);};
  const evStr=(a)=>{const r=ev(a);return F.toStr(r.value);};

    const vals=[];

        const arr=F.getRangeValues(a.v,a.sheet||ctx.sheet.name,ctx);

      }else{
        const r=ev(a);vals.push(r.value);
      }
    }

  };

    case'MAX':{const ns=getNums();if(!ns.length)return{value:0,error:null};return{value:Math.max(...ns.map(Number)),error:null};}
    case'COUNT':{return{value:getNums().length,error:null};}
    case'COUNTA':{return{value:getValues().filter(v=>v!==''&&v!==null&&v!==undefined).length,error:null};}
    case'ROUND':{const n=evNum(args[0]);const d=args[1]?evNum(args[1]):0;const f=Math.pow(10,d);return{value:Math.round(n*f)/f,error:null};}
    case'ABS':{return{value:Math.abs(evNum(args[0])),error:null};}
    case'SQRT':{const n=evNum(args[0]);if(n<0)return{value:'',error:'#NUM!'};return{value:Math.sqrt(n),error:null};}
    case'POWER':{return{value:Math.pow(evNum(args[0]),evNum(args[1])),error:null};}
    case'MOD':{const d=evNum(args[1]);if(d===0)return{value:'',error:'#DIV/0!'};return{value:evNum(args[0])%d,error:null};}
    case'INT':{return{value:Math.floor(evNum(args[0])),error:null};}
    case'CEILING':{const n=evNum(args[0]);const s=evNum(args[1])||1;return{value:Math.ceil(n/s)*s,error:null};}
    case'FLOOR':{const n=evNum(args[0]);const s=evNum(args[1])||1;return{value:Math.floor(n/s)*s,error:null};}
    case'RAND':{return{value:Math.random(),error:null};}
    case'RANDBETWEEN':{const lo=evNum(args[0]),hi=evNum(args[1]);return{value:Math.floor(Math.random()*(hi-lo+1))+lo,error:null};}

    // Text
    case'CONCATENATE':{let s='';for(const a of args)s+=evStr(a);return{value:s,error:null};}
    case'LEFT':{const s=evStr(args[0]);const n=args[1]?evNum(args[1]):1;return{value:s.substring(0,n),error:null};}
    case'RIGHT':{const s=evStr(args[0]);const n=args[1]?evNum(args[1]):1;return{value:s.substring(s.length-n),error:null};}
    case'MID':{const s=evStr(args[0]);const start=evNum(args[1])-1;const len=evNum(args[2]);return{value:s.substring(start,start+len),error:null};}
    case'LEN':{return{value:evStr(args[0]).length,error:null};}
    case'UPPER':{return{value:evStr(args[0]).toUpperCase(),error:null};}
    case'LOWER':{return{value:evStr(args[0]).toLowerCase(),error:null};}
    case'TRIM':{return{value:evStr(args[0]).trim().replace(/ +/g,' '),error:null};}
    case'FIND':{const find=evStr(args[0]);const text=evStr(args[1]);const start=args[2]?evNum(args[2])-1:0;const idx=text.indexOf(find,start);if(idx<0)return{value:'',error:'#VALUE!'};return{value:idx+1,error:null};}

      const ref=args[0];
      if(ref.type!=='ref')return{value:'',error:'#REF!'};

    case'CHOOSE':{const i=evNum(args[0]);return args[i]?ev(args[i]):{value:'',error:'#VALUE!'};}
    case'CONCAT':{let t='';for(const v of getValues())t+=F.toStr(v);return{value:t,error:null};}
    case'TEXTJOIN':{const d=evStr(args[0]),skip=evBool(args[1]),vals=[];for(const a of args.slice(2)){if(a.type==='range')getRange2D(a).flat().forEach(v=>vals.push(v));else vals.push(ev(a).value);}return{value:vals.filter(v=>!skip||(v!==''&&v!=null)).map(v=>F.toStr(v)).join(d),error:null};}
    case'IFS':{for(let i=0;i+1<args.length;i+=2)if(evBool(args[i]))return ev(args[i+1]);return{value:'',error:'#N/A'};}
    case'SIGN':{return{value:Math.sign(evNum(args[0])),error:null};}
    case'PI':{return{value:Math.PI,error:null};}
    case'SUMPRODUCT':{const ar=args.map(a=>getRange2D(a).flat());let sm=0;for(let i=0;i<ar[0].length;i++){let p=1;for(const x of ar)p*=F.toNum(x[i]);sm+=p;}return{value:sm,error:null};}
    default:return{value:'',error:'#NAME?'};
  }
};

Formula.ALIASES={SUMA:'SUM',PROMEDIO:'AVERAGE',SI:'IF',CONTAR:'COUNT',CONTARA:'COUNTA',REDONDEAR:'ROUND','REDONDEAR.MAS':'ROUNDUP','REDONDEAR.MENOS':'ROUNDDOWN',BUSCARV:'VLOOKUP',BUSCARH:'HLOOKUP','SUMAR.SI':'SUMIF','CONTAR.SI':'COUNTIF','PROMEDIO.SI':'AVERAGEIF','SUMAR.SI.CONJUNTO':'SUMIFS','CONTAR.SI.CONJUNTO':'COUNTIFS','SI.ERROR':'IFERROR','SI.ND':'IFNA',Y:'AND',O:'OR',NO:'NOT',CONCATENAR:'CONCATENATE',UNIRCADENAS:'TEXTJOIN',IZQUIERDA:'LEFT',DERECHA:'RIGHT',EXTRAE:'MID',LARGO:'LEN',MAYUSC:'UPPER',MINUSC:'LOWER',NOMPROPIO:'PROPER',HOY:'TODAY',AHORA:'NOW',ENTERO:'INT',RAIZ:'SQRT',POTENCIA:'POWER',RESIDUO:'MOD',ALEATORIO:'RAND',MEDIANA:'MEDIAN',PRODUCTO:'PRODUCT',INDICE:'INDEX',COINCIDIR:'MATCH',SUSTITUIR:'SUBSTITUTE',ENCONTRAR:'FIND',VALOR:'VALUE',ELEGIR:'CHOOSE',SUMAPRODUCTO:'SUMPRODUCT','SI.CONJUNTO':'IFS'};
Formula.critMatch=function(v,crit){
  let op='=',c=crit;
  if(typeof crit==='string'){const m=crit.match(/^(<=|>=|<>|<|>|=)(.*)$/);if(m){op=m[1];c=m[2];}}
  const cn=parseFloat(c),vn=typeof v==='number'?v:parseFloat(v);
  if(String(c).trim()!==''&&isFinite(c)&&!isNaN(cn)&&!isNaN(vn)){
    const d=vn-cn;return op==='='?d===0:op==='<>'?d!==0:op==='<'?d<0:op==='>'?d>0:op==='<='?d<=0:d>=0;
  }
  const a=String(v??'').toLowerCase(),b=String(c).toLowerCase();
  if(op==='='||op==='<>'){
    const rx=new RegExp('^'+b.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$');
    return op==='='?rx.test(a):!rx.test(a);
  }
  return false;
};
// Ajusta referencias relativas al copiar/rellenar fórmulas
Formula.shift=function(f,dr,dc){
  return f.replace(/"[^"]*"|(?<![A-Z0-9_.])(\$?)([A-Z]{1,2})(\$?)(\d+)(?![\d(A-Z_])/gi,(m,a,col,b,row)=>{
    if(m[0]==='"')return m;
    const nc=a?col.toUpperCase():U.colToLetter(Math.max(0,U.letterToCol(col.toUpperCase())+dc));
    const nr=b?row:Math.max(1,+row+dr);
    return a+nc+b+nr;
  });
};

// === MODULE: Formula Engine — Recalculation ===
Formula.recalc=function(sheet){
  // Solo iterar sobre las celdas que sabemos que tienen fórmulas
    if(!sheet.formulaCells) return;
  for(const k of sheet.formulaCells){
    const parts=k.split(',');
    const r=parseInt(parts[0]),c=parseInt(parts[1]);
    const cell=getCell(sheet,r,c);
    // Verificación de seguridad por si la celda fue borrada
    if(cell && cell.f) { 
      this.evalStack=[];
      this.evalCell(sheet,r,c);
    }
  }
};

Formula.recalcAll=function(){
  for(const sheet of State.workbook.sheets){
    this.recalc(sheet);
  }
};

// === MODULE: Selection & Navigation ===
const Sel = {
  selectCell(r,c,extend,multi){
    const sheet=getActiveSheet();
    // Skip hidden rows/cols
    r=U.clamp(r,0,MAX_ROWS-1);
    c=U.clamp(c,0,MAX_COLS-1);
    if(!extend){
      State.selection={start:{r,c},end:{r,c},activeCell:{r,c}};
    }else{
      State.selection.end={r,c};
      State.selection.activeCell={r,c};
    }
    Grid.needsRender=true;
    UI.updateFormulaBar();
    UI.updateStatusBar();
  },

  selectRange(r0,c0,r1,c1){
    State.selection={start:{r:r0,c:c0},end:{r:r1,c:c1},activeCell:{r:r0,c:c0}};
    Grid.needsRender=true;
    UI.updateFormulaBar();
    UI.updateStatusBar();
  },

  moveActive(dr,dc,extend){
    const sel=State.selection;
    let nr=sel.activeCell.r+dr,nc=sel.activeCell.c+dc;
    nr=U.clamp(nr,0,MAX_ROWS-1);nc=U.clamp(nc,0,MAX_COLS-1);
    if(extend){
      sel.end={r:nr,c:nc};
      sel.activeCell={r:nr,c:nc};
    }else{
      this.selectCell(nr,nc);
    }
    this.scrollIntoView(nr,nc);
    Grid.needsRender=true;
    UI.updateFormulaBar();
  },


    jumpToEdge(dr, dc, extend) {
    const sel = State.selection;
    let r = sel.activeCell.r, c = sel.activeCell.c;
    const sheet = getActiveSheet();
    
    const hasData = (rr, cc) => {
      const cell = getCell(sheet, rr, cc);
      return cell && cell.v !== '' && cell.v !== undefined && cell.v !== null;
    };

    const startHasData = hasData(r, c);
    let maxSteps = 5000; // Límite de seguridad

    while (maxSteps-- > 0) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= MAX_ROWS || nc < 0 || nc >= MAX_COLS) break;

      if (startHasData) {
        if (!hasData(nr, nc)) break; // Si empieza con datos, se detiene en el vacío
      } else {
        if (hasData(nr, nc)) { r = nr; c = nc; break; } // Si empieza vacío, salta al siguiente con datos
      }
      r = nr; c = nc;
    }

    if (extend) {
      sel.end = { r, c };
      sel.activeCell = { r, c };
    } else {
      this.selectCell(r, c);
    }
    this.scrollIntoView(r, c);
    Grid.needsRender = true;
    UI.updateFormulaBar();
  },




  scrollIntoView(r,c){
    const wrap=document.getElementById('gridwrap');
    const x=Grid.colX(c),y=Grid.rowY(r);
    const w=Grid.colWidth(c),h=Grid.rowHeight(r);
    const sx=wrap.scrollLeft,sy=wrap.scrollTop;
    const vw=wrap.clientWidth,vh=wrap.clientHeight;
    const z=State.zoom;
    if(x*z<sx+Grid.cornerW*z)wrap.scrollLeft=x*z-Grid.cornerW*z;
    else if((x+w)*z>sx+vw)wrap.scrollLeft=(x+w)*z-vw;
    if(y*z<sy+Grid.headerH*z)wrap.scrollTop=y*z-Grid.headerH*z;
    else if((y+h)*z>sy+vh)wrap.scrollTop=(y+h)*z-vh;
  },

  getSelectedRange(){
    const sel=State.selection;
    return{
      r0:Math.min(sel.start.r,sel.end.r),
      r1:Math.max(sel.start.r,sel.end.r),
      c0:Math.min(sel.start.c,sel.end.c),
      c1:Math.max(sel.start.c,sel.end.c),
    };
  },

  isSelected(r,c){
    const{r0,r1,c0,c1}=this.getSelectedRange();
    return r>=r0&&r<=r1&&c>=c0&&c<=c1;
  },
};

// === MODULE: Editing ===
const Editor = {
  startEditing(initialValue){
    if(State.editing)return;
    if(EMBED.readonly){UI.toast('Solo lectura');return;}

    const sel=State.selection.activeCell;
    State.editingCell={r:sel.r,c:sel.c};
    const sheet=getActiveSheet();
    const cell=getCell(sheet,sel.r,sel.c);
    const ed=document.getElementById('celleditor');
    ed.style.display='block';
    let val='';
    if(initialValue!==undefined){val=initialValue;}
    else if(cell){val=cell.f||String(cell.v??'');}
    ed.value=val;
    Grid.updateOverlay();
    ed.focus();
    if(initialValue!==undefined){ed.setSelectionRange(ed.value.length,ed.value.length);}
    else{ed.select();}
  },

  finishEditing(cancel){
    if(!State.editing)return;
    State.editing=false;
    const ed=document.getElementById('celleditor');
    ed.style.display='none';
    if(!cancel){
      const sel=State.editingCell;
      const sheet=getActiveSheet();
      const val=ed.value;
      const vr=val===''?{valid:true}:Validation.validate(sheet,sel.r,sel.c,val);
      if(!vr.valid){UI.toast('⚠ '+vr.message);Grid.needsRender=true;UI.updateFormulaBar();return;}
      History.snapshot();
      this.setCellValue(sheet,sel.r,sel.c,val);
      Formula.recalc(sheet);
      Storage.saveDebounced();
      UI.setSaveIndicator(false);
    }
    Grid.needsRender=true;
    UI.updateFormulaBar();
  },

  setCellValue(sheet,r,c,input){
    const cell=getOrCreateCell(sheet,r,c);
    const merge=Grid.getMergeAt(sheet,r,c);
    if(merge&&(merge.r!==r||merge.c!==c)){
      const origin=getOrCreateCell(sheet,merge.r,merge.c);
      this.setCellValueDirect(sheet, merge.r, merge.c, origin, input); // <--- Actualizado
    }else{
      this.setCellValueDirect(sheet, r, c, cell, input); // <--- Actualizado
    }
  },

   setCellValueDirect(sheet, r, c, cell, input){
    const k = cellKey(r, c);
    if(input.startsWith('=')){
            cell.f = input;
      if(sheet.formulaCells) sheet.formulaCells.add(k);
    }else{
      cell.f = null;
      sheet.formulaCells.delete(k); 
      // Try to parse as number
      const n=parseFloat(input);
      if(input!==''&&!isNaN(n)&&/^-?[\d.]+(e[+-]?\d+)?$/i.test(input.trim())){
        cell.v=n;
      }else if(input.toLowerCase()==='true'){cell.v=true;}
      else if(input.toLowerCase()==='false'){cell.v=false;}
      else{cell.v=input;}
    }
    cell.error=null;
  },
};

// === MODULE: History (Undo/Redo) ===
const History = {
  snapshot(force){
    if(EMBED.readonly&&!force)throw new Error('__RO__');
    const snap=U.deepClone(State.workbook);
    State.history=State.history.slice(0,State.historyIdx+1);
    State.history.push(snap);
    if(State.history.length>State.maxHistory)State.history.shift();
    State.historyIdx=State.history.length-1;
  },
  restore(){
    State.workbook=U.deepClone(State.history[State.historyIdx]);
    State.activeSheet=Math.min(State.activeSheet,State.workbook.sheets.length-1);
    Grid.needsRender=true;
    UI.renderSheetTabs();
    UI.updateFormulaBar();
    Storage.saveDebounced();
  },
  undo(){
    if(EMBED.readonly)return;
    // Guardar el estado actual para poder rehacer
    if(State.historyIdx===State.history.length-1){State.history.push(U.deepClone(State.workbook));State.historyIdx=State.history.length-1;}
    if(State.historyIdx<=0)return;
    State.historyIdx--;this.restore();
  },
  redo(){
    if(EMBED.readonly)return;
    if(State.historyIdx>=State.history.length-1)return;
    State.historyIdx++;this.restore();
  },
};

// === MODULE: Clipboard (Copy/Cut/Paste) ===
const Clip = {
  copy(){
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    const sheet=getActiveSheet();
    const data=[];
    for(let r=r0;r<=r1;r++){
      const row=[];
      for(let c=c0;c<=c1;c++){
        const cell=getCell(sheet,r,c);
        row.push(cell?{v:cell.v,f:cell.f,fmt:cell.fmt?U.deepClone(cell.fmt):{}}:'');
      }
      data.push(row);
    }
    State.clipboard={data,r0,c0,r1,c1,sheetIdx:State.activeSheet};
    State.isCutting=false;
    State.showCopyBorder = true; // <--- ACTIVA EL BORDE PUNTEADO
    Grid.needsRender = true; 

    // 1. Generar texto plano (TSV)
    const text = data.map(row => row.map(c => c ? String(c.v ?? '') : '').join('\t')).join('\n');

    // 2. Generar tabla HTML con estilos
    let html = '<table border="1" style="border-collapse: collapse; font-family: Segoe UI, Arial, sans-serif; font-size: 13px;">';
    for (let r = 0; r < data.length; r++) {
      html += '<tr>';
      for (let c = 0; c < data[r].length; c++) {
        const cellData = data[r][c];
        let style = 'padding: 4px 8px; border: 1px solid #ccc; white-space: nowrap;';
        let cellValue = '';

        if (cellData) {
          cellValue = String(cellData.v ?? '');
          const fmt = cellData.fmt || {};

          if (fmt.bg) style += ` background-color: ${fmt.bg};`;
          if (fmt.color) style += ` color: ${fmt.color};`;
          if (fmt.bold) style += ' font-weight: bold;';
          if (fmt.italic) style += ' font-style: italic;';
          if (fmt.align) style += ` text-align: ${fmt.align};`;
          
          if (fmt.borders && Object.keys(fmt.borders).length > 0) {
            const bc = fmt.borders.borderColor || '#000';
            if (fmt.borders.top || fmt.borders.bottom || fmt.borders.left || fmt.borders.right) {
               style += ` border: 1px solid ${bc} !important;`;
            }
          }
        }

        cellValue = cellValue.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html += `<td style="${style}">${cellValue}</td>`;
      }
      html += '</tr>';
    }
    html += '</table>';

    // 3. Enviar ambos formatos al portapapeles
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        const textBlob = new Blob([text], { type: 'text/plain' });
        const htmlBlob = new Blob([html], { type: 'text/html' });
        const item = new ClipboardItem({
          'text/plain': textBlob,
          'text/html': htmlBlob
        });
        navigator.clipboard.write([item]).catch(() => this.fallbackCopy(html, text));
      } else {
        this.fallbackCopy(html, text);
      }
    } catch (e) {
      this.fallbackCopy(html, text);
    }
  },

  // NUEVO: Método para Cortar
  cut(){
    this.copy();
    State.isCutting = true;
  },

  fallbackCopy(html, text) {
    const tempDiv = document.createElement('div');
    tempDiv.style.position = 'fixed';
    tempDiv.style.left = '-9999px';
    tempDiv.style.top = '0';
    tempDiv.innerHTML = html;
    document.body.appendChild(tempDiv);

    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(tempDiv);
    selection.removeAllRanges();
    selection.addRange(range);

    try {
      document.execCommand('copy');
    } catch (err) {
      console.error('Fallback copy failed', err);
    }
    selection.removeAllRanges();
    document.body.removeChild(tempDiv);
  },

  paste(){
    if(!State.clipboard)return;
    const{r0,c0}=Sel.getSelectedRange().r0!==undefined?{r0:Sel.getSelectedRange().r0,c0:Sel.getSelectedRange().c0}:{r0:0,c0:0};
    const sel=State.selection.activeCell;
    const destR=sel.r,destC=sel.c;
    const sheet=getActiveSheet();
    History.snapshot();
    const data=State.clipboard.data;
    for(let r=0;r<data.length;r++){
      for(let c=0;c<data[r].length;c++){
        const dr=destR+r,dc=destC+c;
        if(dr>=MAX_ROWS||dc>=MAX_COLS)continue;
                const src=data[r][c];
        // Si la celda de origen está vacía, limpiamos la de destino
        if(!src || src===''){
          delete sheet.cells[cellKey(dr,dc)];
          continue;
        }
        const cell=getOrCreateCell(sheet,dr,dc);
        cell.v=src.v;cell.f=src.f?(State.isCutting?src.f:Formula.shift(src.f,destR-State.clipboard.r0,destC-State.clipboard.c0)):src.f;cell.fmt=U.deepClone(src.fmt||{});
        cell.error=null;
      }
    }
    if(State.isCutting){
      // Clear source
      const srcSheet=State.workbook.sheets[State.clipboard.sheetIdx];
      for(let r=0;r<data.length;r++){
        for(let c=0;c<data[r].length;c++){
          const sr=State.clipboard.r0+r,sc=State.clipboard.c0+c;
          delete srcSheet.cells[cellKey(sr,sc)];
        }
      }
      State.isCutting=false;
    }
    // Select pasted range
    Sel.selectRange(destR,destC,destR+data.length-1,destC+(data[0]?data[0].length-1:0));
    
    // Auto-ajustar columnas afectadas
    const affectedCols = new Set();
    for(let c=0; c<(data[0]?data[0].length:0); c++) affectedCols.add(destC + c);
    affectedCols.forEach(c => Grid.autoFitColumn(c));

    State.showCopyBorder = false; 	
    Formula.recalc(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
    UI.updateFormulaBar();
  },
};
// === MODULE: Fill Handle ===
const FillHandle = {
  dragging:false,startR:0,startC:0,
  sourceR0:0, sourceR1:0, sourceC0:0, sourceC1:0,

  start(mx,my){
    this.dragging=true;
    const hit=Grid.hitTest(mx,my);
    if(hit.type==='cell'){this.startR=hit.row;this.startC=hit.col;}
  },




  getSmartValue(val, offset) {
    if (typeof val === 'number') return val + offset;
    if (!val || typeof val !== 'string' || offset === 0) return val;

    const lower = val.toLowerCase().trim();

    // 1. Días de la semana
    const days = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
    const dayIdx = days.indexOf(lower);
    if (dayIdx !== -1) {
      const nextIdx = (dayIdx + offset) % 7;
      return days[nextIdx < 0 ? nextIdx + 7 : nextIdx];
    }

    // 2. Meses del año
    const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const monthIdx = months.indexOf(lower);
    if (monthIdx !== -1) {
      const nextIdx = (monthIdx + offset) % 12;
      return months[nextIdx < 0 ? nextIdx + 12 : nextIdx];
    }

    // 3. Fechas (dd/mm/yyyy o yyyy-mm-dd)
    const dateRegex = /^(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,4})$/;
    if (dateRegex.test(val)) {
      const match = val.match(dateRegex);
      let d, m, y;
      if (match[1].length === 4) { // yyyy-mm-dd
        y = parseInt(match[1]); m = parseInt(match[2]) - 1; d = parseInt(match[3]);
      } else { // dd/mm/yyyy
        d = parseInt(match[1]); m = parseInt(match[2]) - 1; y = parseInt(match[3]);
      }
      const date = new Date(y, m, d);
      date.setDate(date.getDate() + offset);
      const pad = (n) => String(n).padStart(2, '0');
      if (match[1].length === 4) return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      return `${pad(date.getDate())}/${pad(date.getMonth() + 1)}/${date.getFullYear()}`;
    }

    // 4. Textos con números al final (ej. "Item 1", "A-100")
    const textNumRegex = /^(.*?)(\d+)$/;
    if (textNumRegex.test(val)) {
      const match = val.match(textNumRegex);
      const prefix = match[1];
      const num = parseInt(match[2]);
      const numStr = String(num + offset).padStart(match[2].length, '0');
      return prefix + numStr;
    }

    return val;
  },

  apply(r1,c1){
    const r0=this.sourceR0, origR1=this.sourceR1;
    const c0=this.sourceC0, origC1=this.sourceC1;
    if(r1 === origR1 && c1 === origC1) return;
    const sheet=getActiveSheet();
    History.snapshot();
    // Determine fill direction
    const fillR0=Math.min(r0,origR1),fillR1=Math.max(r0,origR1);
    const fillC0=Math.min(c0,origC1),fillC1=Math.max(c0,origC1);
    const newR0=Math.min(fillR0,r1),newR1=Math.max(fillR1,r1);
    const newC0=Math.min(fillC0,c1),newC1=Math.max(fillC1,c1);
    // Fill: copy values with auto-increment for numbers
    for(let r=fillR0;r<=newR1;r++){
      for(let c=fillC0;c<=newC1;c++){
        if(r>=fillR0&&r<=fillR1&&c>=fillC0&&c<=fillC1)continue; // skip original
        const srcR=fillR0+((r-fillR0)%(fillR1-fillR0+1));
        const srcC=fillC0+((c-fillC0)%(fillC1-fillC0+1));
        const src=getCell(sheet,srcR,srcC);
        if(!src)continue;
        const cell=getOrCreateCell(sheet,r,c);
        // Auto-increment if number
                // Auto-increment inteligente
        const offset = (r - srcR) !== 0 ? (r - srcR) : (c - srcC);
        let val = this.getSmartValue(src.v, offset);
        cell.v=val;cell.f=src.f?Formula.shift(src.f,r-srcR,c-srcC):null;cell.fmt=U.deepClone(src.fmt||{});
        cell.error=null;
      }
    }
    Sel.selectRange(fillR0,fillC0,newR1,newC1);
    Formula.recalc(sheet);
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
  },
};

// === MODULE: Cell Formatting ===
const Format = {
  applyFormat(value,fmtStr){
    if(typeof value!=='number')return String(value);
    if(!fmtStr||fmtStr==='General')return String(value);
    // Number with decimals: 0.00
    let m;
    if(m=fmtStr.match(/^0(\.0+)?$/)){
      const dec=fmtStr.split('.')[1]?fmtStr.split('.')[1].length:0;
      return value.toFixed(dec);
    }
    // Currency: $#,##0.00
    if(fmtStr.includes('$')||fmtStr.includes('€')||fmtStr.includes('£')){
      const dec=(fmtStr.match(/0\.(0+)/)||[])[1]?fmtStr.match(/0\.(0+)/)[1].length:0;
      const sym=fmtStr.match(/[\$€£]/)[0];
      return sym+value.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    }
    // Percentage: 0%
    if(fmtStr.includes('%')){
      const dec=(fmtStr.match(/0\.(0+)%/)||[])[1]?fmtStr.match(/0\.(0+)%/)[1].length:0;
      return (value*100).toFixed(dec)+'%';
    }
    // Thousands: #,##0
    if(fmtStr.includes('#,##0')){
      const dec=fmtStr.includes('.')?(fmtStr.split('.')[1]||'0').length:0;
      return value.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    }
    // Date: yyyy-mm-dd or dd/mm/yyyy or mm/dd/yyyy
    if(/y|m|d/i.test(fmtStr)&&!/SUM|AVG/.test(fmtStr)){
      const d=new Date(Math.round((value-25569)*86400*1000));
      if(isNaN(d))return String(value);
      return fmtStr.replace(/yyyy/g,d.getFullYear())
        .replace(/yy/g,String(d.getFullYear()).slice(-2))
        .replace(/mm/g,String(d.getMonth()+1).padStart(2,'0'))
        .replace(/dd/g,String(d.getDate()).padStart(2,'0'))
        .replace(/m/g,d.getMonth()+1)
        .replace(/d/g,d.getDate());
    }
    return String(value);
  },

  applyToSelection(prop,value){
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    const sheet=getActiveSheet();
    History.snapshot();
    for(let r=r0;r<=r1;r++){
      for(let c=c0;c<=c1;c++){
        const merge=Grid.getMergeAt(sheet,r,c);
        const rr=merge?merge.r:r,cc=merge?merge.c:c;
        const cell=getOrCreateCell(sheet,rr,cc);
        if(!cell.fmt)cell.fmt={};
        cell.fmt[prop]=value;
      }
    }
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
    UI.updateFormulaBar();
  },

  toggleBold(){const sheet=getActiveSheet();const cell=getCell(sheet,State.selection.activeCell.r,State.selection.activeCell.c);const cur=cell&&cell.fmt&&cell.fmt.bold;this.applyToSelection('bold',!cur);},
  toggleItalic(){const sheet=getActiveSheet();const cell=getCell(sheet,State.selection.activeCell.r,State.selection.activeCell.c);const cur=cell&&cell.fmt&&cell.fmt.italic;this.applyToSelection('italic',!cur);},
  toggleUnderline(){const sheet=getActiveSheet();const cell=getCell(sheet,State.selection.activeCell.r,State.selection.activeCell.c);const cur=cell&&cell.fmt&&cell.fmt.underline;this.applyToSelection('underline',!cur);},
  toggleStrike(){const sheet=getActiveSheet();const cell=getCell(sheet,State.selection.activeCell.r,State.selection.activeCell.c);const cur=cell&&cell.fmt&&cell.fmt.strike;this.applyToSelection('strike',!cur);},
  setAlign(a){this.applyToSelection('align',a);},
  setVAlign(a){this.applyToSelection('valign',a);},
  setFormat(f){this.applyToSelection('format',f);},
  setFontSize(s){this.applyToSelection('size',s);},
  setFont(f){this.applyToSelection('font',f);},
  setBg(color){this.applyToSelection('bg',color);},
  setColor(color){this.applyToSelection('color',color);},
  setBorder(side,style,color){
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    const sheet=getActiveSheet();
    History.snapshot();
    for(let r=r0;r<=r1;r++){
      for(let c=c0;c<=c1;c++){
        const cell=getOrCreateCell(sheet,r,c);
        if(!cell.fmt)cell.fmt={};
        if(!cell.fmt.borders)cell.fmt.borders={};
        if(side==='all'){
          cell.fmt.borders={top:style,bottom:style,left:style,right:style,borderColor:color||'#000'};
        }else if(side==='outline'){
          if(r===r0)cell.fmt.borders.top=style;
          if(r===r1)cell.fmt.borders.bottom=style;
          if(c===c0)cell.fmt.borders.left=style;
          if(c===c1)cell.fmt.borders.right=style;
          cell.fmt.borders.borderColor=color||'#000';
        }else if(side==='none'){
          cell.fmt.borders={};
        }else{
          cell.fmt.borders[side]=style;
          cell.fmt.borders.borderColor=color||'#000';
        }
      }
    }
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
    UI.updateFormulaBar();
  },

  // Merge & Unmerge
  mergeSelection(){
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    const sheet=getActiveSheet();
    History.snapshot();
    if(r0===r1&&c0===c1)return;
    const merge={r:r0,c:c0,rs:r1-r0+1,cs:c1-c0+1};
    sheet.merges[cellKey(r0,c0)]=merge;
    // Move value to origin
    const origin=getOrCreateCell(sheet,r0,c0);
    for(let r=r0;r<=r1;r++){
      for(let c=c0;c<=c1;c++){
        if(r===r0&&c===c0)continue;
        const cell=getCell(sheet,r,c);
        if(cell&&cell.v!==''&&cell.v!==undefined&&!origin.v){origin.v=cell.v;origin.f=cell.f;}
        if(r!==r0||c!==c0){delete sheet.cells[cellKey(r,c)];}
      }
    }
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
    UI.updateFormulaBar();
  },

  unmergeSelection(){
    const sheet=getActiveSheet();
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    History.snapshot();
    for(const k in sheet.merges){
      const m=sheet.merges[k];
      if(m.r>=r0&&m.r<=r1&&m.c>=c0&&m.c<=c1){
        delete sheet.merges[k];
      }
    }
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
    UI.updateFormulaBar();
  },

  // Format Painter
  painterCopy(){
    const sheet=getActiveSheet();
    const cell=getCell(sheet,State.selection.activeCell.r,State.selection.activeCell.c);
    if(cell&&cell.fmt)State.formatPainter=U.deepClone(cell.fmt);
  },
  painterApply(){
    if(!State.formatPainter)return;
    const{r0,r1,c0,c1}=Sel.getSelectedRange();
    const sheet=getActiveSheet();
    History.snapshot();
    for(let r=r0;r<=r1;r++){
      for(let c=c0;c<=c1;c++){
        const cell=getOrCreateCell(sheet,r,c);
        cell.fmt=U.deepClone(State.formatPainter);
      }
    }
    Grid.needsRender=true;
    Storage.saveDebounced();
    UI.setSaveIndicator(false);
    UI.updateFormulaBar();
    State.formatPainter=null;
  },
};
